const reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
const lensState = {
  dragging: false, pointerId: null, suppressClick: false,
  cx: 0, cy: 0, tx: 0, w: 0, h: 0, mag: LENS_MAG, centers: [], startX: 0, coveredIdx: -1,
  barLeft: 0, settleTimer: 0,
};
function fitTabLabels() {
  /* 按实测校准标签字号：任一标签文字宽超过按钮宽 − 6px 时，等比调小 --tab-fs（五标签
     同字号同比例），保证真机字体度量/系统字号浮动时文字仍完整落在按钮内、不探出。
     先撤掉上次的行内校准再量原始宽度，避免反复调用越量越小。 */
  const bar = document.getElementById("tabbar");
  if (!bar) return;
  const btns = bar.querySelectorAll("[data-tab]");
  if (!btns.length) return;
  bar.style.removeProperty("--tab-fs");
  let ratio = Infinity, fs = 0;
  btns.forEach((b) => {
    const l = b.querySelector(".tab-label");
    if (!l) return;
    if (!fs) fs = parseFloat(window.getComputedStyle(l).fontSize) || 8;
    const w = l.scrollWidth;
    if (w > 0 && b.clientWidth > 0) ratio = Math.min(ratio, (b.clientWidth - 6) / w);
  });
  if (fs && ratio < 1) bar.style.setProperty("--tab-fs", Math.max(6.5, Math.floor(fs * ratio * 10) / 10) + "px");
}
function lensMeasure() {
  const bar = document.getElementById("tabbar");
  const lens = document.getElementById("tabLens");
  if (!bar || !lens) return false;
  const btns = bar.querySelectorAll("[data-tab]");
  if (!btns.length) return false;
  lensState.centers = Array.from(btns).map((b) => b.offsetLeft + b.offsetWidth / 2);
  lensState.cy = bar.clientHeight / 2;
  lensState.w = btns[0].offsetWidth;
  lensState.h = Math.min(btns[0].offsetHeight + 4, bar.clientHeight - 8);
  lens.style.width = lensState.w + "px";
  lens.style.height = lensState.h + "px";
  const stage = document.getElementById("tabLensStage");
  if (stage) {
    stage.style.width = bar.clientWidth + "px";
    stage.style.height = bar.clientHeight + "px";
    /* 克隆层内边距逐项复制导航条，保证克隆按钮与真实按钮逐像素重合 */
    const cs = window.getComputedStyle(bar);
    stage.style.padding = cs.paddingTop + " " + cs.paddingRight + " " + cs.paddingBottom + " " + cs.paddingLeft;
  }
  /* 放大倍率按实测自适应：最长标签文字宽 × 倍率 ≤ 透镜宽 − 10（两侧各留 5px）；
     字体度量浮动时宁可倍率略降，也不再让首尾字被透镜边缘切掉、看起来「突出来」 */
  let maxLabel = 0;
  btns.forEach((b) => { const l = b.querySelector(".tab-label"); if (l) maxLabel = Math.max(maxLabel, l.scrollWidth); });
  lensState.mag = maxLabel > 0 ? Math.max(0.8, Math.min(LENS_MAG, (lensState.w - 10) / maxLabel)) : LENS_MAG;
  const idx = Math.max(0, TABS.findIndex((t) => t.id === currentTab));
  lensState.tx = lensState.centers[idx];
  return true;
}
function lensWrite() {
  const lens = document.getElementById("tabLens");
  if (!lens) return;
  const s = lensState;
  s.cx = s.tx;
  lens.style.transform = "translate3d(" + (s.tx - s.w / 2).toFixed(1) + "px," + (s.cy - s.h / 2).toFixed(1) + "px,0)";
  const stage = document.getElementById("tabLensStage");
  const mag = s.mag || LENS_MAG;
  if (stage) stage.style.transform = "translate3d(" + (s.w / 2 - mag * s.tx).toFixed(1) + "px," + (s.h / 2 - mag * s.cy).toFixed(1) + "px,0) scale(" + mag + ")";
  lensSyncCovered();
}
function lensSyncCovered() {
  /* 防重影：透镜当前罩住的底层标签（落位目标 / 拖动时离透镜中心最近者）淡出原始图标文字，
     透镜内只留放大的克隆一份；仅在罩住对象变化时改一次 class，拖动逐帧调用也零额外开销。 */
  const s = lensState;
  if (!s.centers.length) return;
  let best = 0, bd = Infinity;
  s.centers.forEach((c, i) => { const d = Math.abs(c - s.tx); if (d < bd) { bd = d; best = i; } });
  if (best === s.coveredIdx) return;
  s.coveredIdx = best;
  document.querySelectorAll("#tabbar [data-tab]").forEach((b, i) => b.classList.toggle("tab-covered", i === best));
}
function lensSnap(on) {
  const lens = document.getElementById("tabLens");
  const stage = document.getElementById("tabLensStage");
  if (lens) lens.classList.toggle("lens-snap", on);
  if (stage) stage.classList.toggle("lens-snap", on);
}
function lensSetMoving(on) {
  /* 运动期间给透镜挂 .lens-moving 暂停 backdrop 模糊采样（见 CSS），落位后恢复小半径模糊 */
  const lens = document.getElementById("tabLens");
  if (lens) lens.classList.toggle("lens-moving", on);
}
function lensArmSettle() {
  /* 落位恢复模糊：优先靠透镜 transitionend 事件，这里是超时兜底（过渡被打断/无过渡时不残留） */
  clearTimeout(lensState.settleTimer);
  lensState.settleTimer = setTimeout(() => { if (!lensState.dragging) lensSetMoving(false); }, 520);
}
function moveTabLens(animate) {
  if (!lensMeasure()) return;
  if (animate && tabLensReady && !reduceMotion) {
    lensSetMoving(true);
    lensSnap(false);
    lensWrite();
    lensArmSettle();
  } else {
    lensSnap(true);
    lensWrite();
    const lens = document.getElementById("tabLens");
    if (lens) void lens.offsetWidth;
    lensSnap(false);
    if (!lensState.dragging) lensSetMoving(false);
  }
}
function lensCurrentCenter() {
  /* 拖动接管瞬间读取合成器当前帧位置，从视觉位置起步，不从过渡目标点跳变 */
  const lens = document.getElementById("tabLens");
  if (lens && lensState.w) {
    const m = window.getComputedStyle(lens).transform;
    if (m && m.indexOf("matrix") === 0) {
      const parts = m.slice(m.indexOf("(") + 1, m.lastIndexOf(")")).split(",");
      const v = parseFloat(parts[4]);
      if (!isNaN(v)) return v + lensState.w / 2;
    }
  }
  return lensState.tx;
}
function bindLensDrag(bar) {
  bar.addEventListener("pointerdown", (e) => {
    const s = lensState;
    if (!e.isPrimary || s.pointerId !== null) return;
    if (!e.target.closest || !e.target.closest("[data-tab]")) return;
    s.pointerId = e.pointerId;
    s.startX = e.clientX;
  });
  bar.addEventListener("pointermove", (e) => {
    const s = lensState;
    if (e.pointerId !== s.pointerId) return;
    if (!s.dragging && Math.abs(e.clientX - s.startX) > 7) {
      s.dragging = true;
      try { bar.setPointerCapture(e.pointerId); } catch (err) {}
      /* 拖动全程暂停透镜 backdrop 模糊；导航条左缘只在起拖时读一次，跟随中只写 transform，
         不逐帧触发布局读取（getBoundingClientRect 每帧读也是卡顿来源之一） */
      lensSetMoving(true);
      s.barLeft = bar.getBoundingClientRect().left + 1;
      lensSnap(true);
      s.tx = lensCurrentCenter();
      lensWrite();
    }
    if (!s.dragging || !s.centers.length) return;
    const x = e.clientX - s.barLeft;
    s.tx = Math.min(s.centers[s.centers.length - 1], Math.max(s.centers[0], x));
    lensWrite();
  });
  const endDrag = (e) => {
    const s = lensState;
    if (e.pointerId !== s.pointerId) return;
    const wasDrag = s.dragging;
    s.dragging = false; s.pointerId = null;
    if (!wasDrag) return;
    /* 拖动结束后的合成 click 吞掉，避免落位后又触发一次点选重渲染 */
    s.suppressClick = true;
    setTimeout(() => { s.suppressClick = false; }, 400);
    let best = 0, bd = Infinity;
    s.centers.forEach((c, i) => { const d = Math.abs(c - s.tx); if (d < bd) { bd = d; best = i; } });
    const t = TABS[best];
    if (t && t.id !== currentTab) {
      /* 与点选一致：切回国家页不整页重建，仅从国家详情返回时回列表重渲染一次 */
      const backToList = t.id === "explore" && !!exploreState.countryCode;
      if (backToList) exploreState.countryCode = null;
      switchTab(t.id);
      if (backToList) renderExplore();
    } else if (s.centers.length) {
      s.tx = s.centers[best];
      lensSetMoving(true);
      lensSnap(false);
      lensWrite();
      lensArmSettle();
    }
  };
  bar.addEventListener("pointerup", endDrag);
  bar.addEventListener("pointercancel", endDrag);
  bar.addEventListener("click", (e) => {
    if (lensState.suppressClick) { lensState.suppressClick = false; e.preventDefault(); e.stopPropagation(); }
  }, true);
}
function renderTabbar() {
  const bar = document.getElementById("tabbar");
  const completeness = profileCompleteness(profile);
  /* 透镜与按钮都只建一次：此前每次切换标签都整栏重建按钮+克隆，安卓 WebView 会把导航
     瓦片整批作废重栅格化，录屏实证切换瞬间出现一帧「标签缺失、内容半成品」的闪屏帧；
     此后 renderTabbar 只同步选中态与角标，不动按钮 DOM 结构。 */
  let lens = document.getElementById("tabLens");
  if (!lens) {
    lens = document.createElement("div");
    lens.id = "tabLens";
    lens.className = "tab-lens";
    lens.setAttribute("aria-hidden", "true");
    lens.innerHTML = '<div class="tab-lens-stage" id="tabLensStage"></div><div class="tab-lens-shade" aria-hidden="true"></div>';
    bar.appendChild(lens);
    bindLensDrag(bar);
    /* 透镜滑动落位（transform 过渡结束）→ 撤掉 .lens-moving，恢复静止时的小半径 backdrop 模糊 */
    lens.addEventListener("transitionend", (e) => {
      if (e.propertyName === "transform" && !lensState.dragging) { clearTimeout(lensState.settleTimer); lensSetMoving(false); }
    });
    const html = TABS.map((t) => {
      return '<button type="button" data-tab="' + t.id + '" aria-pressed="false" aria-label="' + t.label + '" class="relative flex min-w-0 flex-1 flex-col items-center justify-center gap-1 rounded-full px-0 py-1 font-semibold transition">' +
        '<span class="text-base leading-none" aria-hidden="true">' + t.icon + "</span>" +
        '<span class="tab-label flex max-w-full items-center justify-center text-center">' + (t.short || t.label) + "</span>" +
      "</button>";
    }).join("");
    bar.insertAdjacentHTML("beforeend", html);
    bar.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
      const id = b.getAttribute("data-tab");
      if (id === currentTab) {
        /* 点已选中的当前标签：完全无操作——不重渲染、不重绘、不动透镜；
           例外一：在入境卡子视图里点本标签 = 返回国家/地区签证（列表或来时的详情页）；
           例外二：在国家详情里点本标签 = 回到国家列表（原有行为）。 */
        if (id === "explore" && arrivalOpen) { closeArrival(); return; }
        if (id === "explore" && exploreState.countryCode) {
          exploreState.countryCode = null;
          renderExplore();
          window.scrollTo({ top: 0 });
        }
        return;
      }
      /* 切回国家页：面板 DOM 在隐藏期间保留，不整页重建（306 张卡重建是切换闪屏的主因）；
         仅当离开时停在国家详情（countryCode 有值）才回列表并重渲染一次 */
      const backToList = id === "explore" && !!exploreState.countryCode;
      if (backToList) exploreState.countryCode = null;
      switchTab(id);
      if (backToList) renderExplore();
    }));
  }
  /* 状态同步：选中态、未选中置灰、档案完成度角标——只改类名/属性/角标，不重建节点 */
  bar.querySelectorAll("[data-tab]").forEach((b) => {
    const id = b.getAttribute("data-tab");
    const active = id === currentTab;
    b.setAttribute("aria-pressed", active ? "true" : "false");
    b.classList.toggle("text-[var(--dim)]", !active);
    if (id === "profile") {
      let badge = b.querySelector(".tab-badge");
      const show = completeness > 0 && completeness < 100;
      if (show && !badge) {
        badge = document.createElement("span");
        badge.className = "tab-badge absolute right-2 top-1 rounded-full bg-[var(--warn)] px-1 text-[9px] font-black text-white";
        b.appendChild(badge);
      }
      if (badge) { if (show) badge.textContent = completeness + "%"; else badge.remove(); }
    }
  });
  fitTabLabels();
  /* 透镜内的放大克隆：与真实按钮同标记同类名，由 .tab-lens-stage 的定点放大呈现；
     克隆层只占透镜内约一格面积；仅当角标完成度变化时才重建克隆，
     每次切标签都重建会在透镜下闪一帧 */
  const stage = document.getElementById("tabLensStage");
  if (stage && renderTabbar._cloneSig !== completeness) {
    renderTabbar._cloneSig = completeness;
    stage.innerHTML = "";
    bar.querySelectorAll("[data-tab]").forEach((b) => {
      const c = b.cloneNode(true);
      c.removeAttribute("data-tab");
      c.removeAttribute("aria-pressed");
      c.removeAttribute("aria-label");
      c.setAttribute("data-tab-clone", "");
      c.setAttribute("tabindex", "-1");
      stage.appendChild(c);
    });
  }
  lensState.coveredIdx = -1; /* 状态刚同步，强制透镜落位时重新同步 .tab-covered */
  moveTabLens(tabLensReady);
  tabLensReady = true;
}
window.addEventListener("resize", () => { fitTabLabels(); moveTabLens(false); });
/* 网络字体加载完成后字体度量会变，重新校准一次标签字号与透镜倍率 */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitTabLabels(); moveTabLens(false); });
function syncPanels() {
  /* 面板显隐的唯一出口：五个标签面板按 currentTab 切换；入境卡是 explore 的子视图，
     arrivalOpen 时以 panel-arrival 顶替 panel-explore 显示（两者同属「国家/地区签证」标签）。 */
  for (const t of TABS) {
    let show = t.id === currentTab;
    if (t.id === "explore" && arrivalOpen) show = false;
    document.getElementById("panel-" + t.id).classList.toggle("hidden", !show);
  }
  document.getElementById("panel-arrival").classList.toggle("hidden", !(currentTab === "explore" && arrivalOpen));
}
function switchTab(id) {
  /* 连点当前标签：不重建导航、不重渲染面板（仅同步面板显隐与透镜落位），杜绝快速连点的竞态花屏 */
  if (id === currentTab) { syncPanels(); moveTabLens(true); return; }
  currentTab = id;
  visitedTabs.add(id);
  syncPanels();
  renderTabbar();
  if (id === "map") initMap();
  if (id === "interview" && !document.getElementById("panel-interview").innerHTML) renderInterview();
  /* 档案/工具箱面板建好后保留 DOM：反复进出标签不再整页重建（重建即闪屏），
     数据变化走各自的就地更新；openTool/保存等动作会显式重渲染 */
  if (id === "profile" && !document.getElementById("panel-profile").innerHTML) renderProfile();
  if (id === "tools" && !document.getElementById("panel-tools").innerHTML) renderTools();
  if (id !== "interview") ivStopAudio();
}
const CLOCK_DATE_FMT = new Intl.DateTimeFormat("zh-CN", { timeZone: "Asia/Shanghai", year: "numeric", month: "long", day: "numeric", weekday: "long" });
const CLOCK_TIME_FMT = new Intl.DateTimeFormat("zh-CN", { timeZone: "Asia/Shanghai", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
function tickClock() {
  const now = new Date();
  const d = CLOCK_DATE_FMT.format(now), t = CLOCK_TIME_FMT.format(now);
  document.getElementById("clockDate").textContent = d;
  document.getElementById("clockTime").textContent = t;
  document.getElementById("clockPill").setAttribute("aria-label", "北京时间：" + d + " " + t);
}
/* ================= 本地保存：变更即存（防抖） + 启动恢复 ================= */
let saveAllTimer = null;
function persist() { clearTimeout(saveAllTimer); saveAllTimer = setTimeout(saveAllNow, 200); }
function saveAllNow() {
  lsWrite("profile", profile);
  lsWrite("profileDraft", profState.form);
  lsWrite("applications", Array.from(applications.entries()));
  lsWrite("detailCache", Array.from(detailCache.entries()));
  lsWrite("forms", Array.from(formDrafts.entries()));
  lsWrite("arrival", { sel: arrivalState.sel, values: arrivalState.values, recognized: arrivalState.recognized });
  lsWrite("assess", assessState);
  lsWrite("sessions", sessions);
  lsWrite("itin", itinState);
  lsWrite("theme", themeMode);
}
function restoreLate() {
  const dc = lsRead("detailCache");
  if (Array.isArray(dc)) dc.forEach((pair) => { if (Array.isArray(pair) && pair[1]) detailCache.set(pair[0], pair[1]); });
  const fm = lsRead("forms");
  if (Array.isArray(fm)) fm.forEach((pair) => { if (Array.isArray(pair) && pair[1]) formDrafts.set(pair[0], pair[1]); });
  const ar = lsRead("arrival");
  if (ar && typeof ar === "object") {
    if (ar.sel && ARRIVAL_GUIDES[ar.sel]) arrivalState.sel = ar.sel;
    if (ar.values && typeof ar.values === "object") arrivalState.values = ar.values;
    if (ar.recognized && typeof ar.recognized === "object") arrivalState.recognized = ar.recognized;
  }
  const as = lsRead("assess");
  if (as && typeof as === "object") Object.assign(assessState, as);
  const it = lsRead("itin");
  if (it && typeof it === "object") Object.assign(itinState, it);
  const pd = lsRead("profileDraft");
  if (pd && typeof pd === "object") profState.form = Object.assign({}, EMPTY_PROFILE, pd);
}
function collectAllData() {
  return {
    app: "全球签证助手", dataVersion: 1, exportedAt: new Date().toISOString(),
    profile: profile,
    applications: Array.from(applications.entries()),
    detailCache: Array.from(detailCache.entries()),
    forms: Array.from(formDrafts.entries()),
    arrival: { sel: arrivalState.sel, values: arrivalState.values, recognized: arrivalState.recognized },
    assess: assessState,
    sessions: sessions,
    itin: itinState,
    theme: themeMode,
  };
}
function clearAllData() {
  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(LS_PREFIX) === 0) keys.push(k); }
    keys.forEach((k) => localStorage.removeItem(k));
  } catch (e) {}
  profile = Object.assign({}, EMPTY_PROFILE);
  profState.form = null;
  applications.clear(); detailCache.clear(); formDrafts.clear();
  arrivalState.values = {}; arrivalState.recognized = {}; arrivalState.ocrMsg = null;
  ASSESS_QS.forEach((q) => { assessState[q.key] = ""; });
  sessions.length = 0;
  renderTabbar();
  renderProfile();
  renderExplore();
  if (document.getElementById("panel-arrival").innerHTML) renderArrival();
  if (document.getElementById("panel-tools").innerHTML) renderTools();
  if (document.getElementById("panel-interview").innerHTML) renderInterview();
}
restoreLate();

setInterval(tickClock, 1000);
tickClock();
renderTabbar();
renderExplore();
</script>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<title>全球签证助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet" />
<style>
/* ===== 液态玻璃主题：参照开源项目 Kyant0/AndroidLiquidGlass 的分层光学模型在 Web 上复刻——
   背景层：模糊 + 饱和提亮（vibrancy）；表面层：半透明色 + 光泽渐变；高光层：顶部方向高光（highlight）；
   内阴影层：上下内侧阴影塑出玻璃厚度（innerShadow）。浅色 / 深色两套参数各自成体系。
   边缘折射感由左右双色内侧高光（青/暖色散边）+ 顶部镜面高光 + 描边静态模拟；
   底部导航的一格大小放大透镜用布局对齐的克隆层做定点光学放大（1.08 倍，可拖动跟随 + CSS 过渡落位），
   内容区卡片用静态模糊 + 高光模拟同一套玻璃语言，全站零 SVG 滤镜链，保真机流畅。 ===== */
:root {
  color-scheme: light dark;
  /* 浅色 = 系统设置页式干净浅色（参照用户手机系统设置截图）：近白浅灰底 #f2f2f5、
     纯白卡片、大圆角、深色文字、细分隔线；不再用彩色渐变底与彩色光晕（光晕在浅色下隐藏）。
     深色变量在下方两处深色块里整套覆盖，本块的改动不影响深色档。 */
  --bg: #f2f2f5;
  --bg-rgb: 242, 242, 245;
  --scene-1: #2ec4b6;
  --scene-2: #f08a4b;
  --scene-3: #5b8def;
  --scene-4: #9a6fe0;
  --scene-base: #f2f2f5;
  --surface: #ffffff;
  --glass: rgba(255, 255, 255, 0.92);
  --glass-strong: rgba(255, 255, 255, 0.96);
  --glass-soft: rgba(255, 255, 255, 0.55);
  --glass-menu: rgba(255, 255, 255, 0.94);
  --text: #0a1e33;
  --dim: #33536e;
  --border: rgba(15, 23, 42, 0.08);
  --edge: rgba(15, 23, 42, 0.08);
  --accent: #0e7c86;
  --accent-ink: #ffffff;
  --warn: #b45309;
  --good: #047857;
  --bad: #b91c1c;
  --radius: 20px;
  --space-surface: var(--glass);
  --space-surface-alt: var(--glass-strong);
  --space-muted: var(--dim);
  --space-border: var(--border);
  --space-accent: var(--accent);
  --spec-hi: rgba(255, 255, 255, 0.9);
  --spec-mid: rgba(255, 255, 255, 0.5);
  --glass-sheen:
    linear-gradient(180deg, rgba(255, 255, 255, 0.50) 0%, rgba(255, 255, 255, 0) 34%),
    radial-gradient(130% 105% at 50% -12%, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 55%);
  --glass-shadow:
    inset 0 1px 0 var(--spec-hi),
    inset 0 -1px 0 rgba(255, 255, 255, 0.40),
    0 1px 2px rgba(16, 24, 40, 0.04),
    0 12px 32px rgba(16, 24, 40, 0.08);
  --font-display: "Noto Serif SC", "Songti SC", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0c;
    --bg-rgb: 10, 10, 12;
    --scene-1: #14342c;
    --scene-2: #3a2415;
    --scene-3: #152740;
    --scene-4: #271f3d;
    --scene-base: #0a0a0c;
    --surface: rgba(255, 255, 255, 0.06);
    --glass: rgba(46, 46, 52, 0.55);
    --glass-strong: rgba(54, 54, 62, 0.72);
    --glass-soft: rgba(42, 42, 48, 0.42);
    --glass-menu: rgba(22, 22, 26, 0.94);
    --text: #f5f5f7;
    --dim: #a7a7ad;
    --border: rgba(255, 255, 255, 0.14);
    --edge: rgba(255, 255, 255, 0.10);
    --accent: #39d0c4;
    --accent-ink: #062a2e;
    --warn: #fbbf24;
    --good: #34d399;
    --bad: #f87171;
    --spec-hi: rgba(255, 255, 255, 0.42);
    --spec-mid: rgba(255, 255, 255, 0.16);
    --glass-sheen:
      linear-gradient(112deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.08) 34%, rgba(255, 255, 255, 0) 55%),
      radial-gradient(130% 105% at 50% -12%, rgba(255, 255, 255, 0.16) 0%, rgba(190, 225, 255, 0) 55%),
      linear-gradient(0deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0) 26%);
    --glass-shadow:
      inset 0 1px 0 var(--spec-hi),
      inset 0 -1px 0 rgba(255, 255, 255, 0.14),
      inset 1px 0 0 rgba(255, 255, 255, 0.13),
      inset -1px 0 0 rgba(255, 255, 255, 0.08),
      inset 0 20px 26px -18px rgba(255, 255, 255, 0.22),
      inset 0 -18px 24px -16px rgba(255, 255, 255, 0.07),
      inset 0 -14px 22px -14px rgba(0, 4, 12, 0.28),
      inset 3px 0 9px -3px rgba(255, 255, 255, 0.10),
      inset -3px 0 9px -3px rgba(255, 255, 255, 0.06),
      inset 0 0 26px rgba(255, 255, 255, 0.03),
      0 16px 38px rgba(0, 6, 16, 0.48);
  }
}
:root[data-theme="dark"] {
    --bg: #0a0a0c;
    --bg-rgb: 10, 10, 12;
    --scene-1: #14342c;
    --scene-2: #3a2415;
    --scene-3: #152740;
    --scene-4: #271f3d;
    --scene-base: #0a0a0c;
    --surface: rgba(255, 255, 255, 0.06);
    --glass: rgba(46, 46, 52, 0.55);
    --glass-strong: rgba(54, 54, 62, 0.72);
    --glass-soft: rgba(42, 42, 48, 0.42);
    --glass-menu: rgba(22, 22, 26, 0.94);
    --text: #f5f5f7;
    --dim: #a7a7ad;
    --border: rgba(255, 255, 255, 0.14);
    --edge: rgba(255, 255, 255, 0.10);
    --accent: #39d0c4;
    --accent-ink: #062a2e;
    --warn: #fbbf24;
    --good: #34d399;
    --bad: #f87171;
    --spec-hi: rgba(255, 255, 255, 0.42);
    --spec-mid: rgba(255, 255, 255, 0.16);
    --glass-sheen:
      linear-gradient(112deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.08) 34%, rgba(255, 255, 255, 0) 55%),
      radial-gradient(130% 105% at 50% -12%, rgba(255, 255, 255, 0.16) 0%, rgba(190, 225, 255, 0) 55%),
      linear-gradient(0deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0) 26%);
    --glass-shadow:
      inset 0 1px 0 var(--spec-hi),
      inset 0 -1px 0 rgba(255, 255, 255, 0.14),
      inset 1px 0 0 rgba(255, 255, 255, 0.13),
      inset -1px 0 0 rgba(255, 255, 255, 0.08),
      inset 0 20px 26px -18px rgba(255, 255, 255, 0.22),
      inset 0 -18px 24px -16px rgba(255, 255, 255, 0.07),
      inset 0 -14px 22px -14px rgba(0, 4, 12, 0.28),
      inset 3px 0 9px -3px rgba(255, 255, 255, 0.10),
      inset -3px 0 9px -3px rgba(255, 255, 255, 0.06),
      inset 0 0 26px rgba(255, 255, 255, 0.03),
      0 16px 38px rgba(0, 6, 16, 0.48);
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

/* 性能取舍（目标机型 iQOO Neo9S Pro / 安卓 WebView）：全站不使用 SVG 位移折射滤镜链
   （feDisplacementMap 在滚动时逐卡重算、且在 WebView 快速重绘时会把滤镜区域画成方形色块），也不逐卡 translateZ(0) 强制建层；
   玻璃感由静态小半径模糊 + 光泽渐变 + 双色边缘高光/描边模拟；真实放大只在底部导航透镜一处小面积元素上用克隆层实现。 */
.glass {
  background-color: var(--glass);
  background-image: var(--glass-sheen);
  -webkit-backdrop-filter: blur(6px) saturate(170%) brightness(1.04);
  backdrop-filter: blur(6px) saturate(170%) brightness(1.04);
  border: 1px solid var(--border);
  box-shadow:
    inset 0 1px 0 var(--spec-hi),
    inset 0 -1px 0 rgba(255, 255, 255, 0.12),
    inset 0 14px 18px -14px rgba(255, 255, 255, 0.20),
    inset 2px 0 6px -2px rgba(56, 178, 199, 0.22),
    inset -2px 0 6px -2px rgba(240, 138, 75, 0.16),
    0 8px 20px rgba(4, 32, 54, 0.10);
  border-radius: var(--radius);
}
.glass-strong {
  background-color: var(--glass-strong);
  background-image: var(--glass-sheen);
  -webkit-backdrop-filter: blur(9px) saturate(180%) brightness(1.05);
  backdrop-filter: blur(9px) saturate(180%) brightness(1.05);
  border: 1px solid var(--border);
  box-shadow: var(--glass-shadow), 0 20px 44px rgba(4, 32, 54, 0.22);
  border-radius: var(--radius);
}
.glass-menu {
  background-color: var(--glass-menu);
  background-image: var(--glass-sheen);
  -webkit-backdrop-filter: blur(14px) saturate(170%);
  backdrop-filter: blur(14px) saturate(170%);
  border: 1px solid var(--border);
  box-shadow: var(--glass-shadow), 0 20px 44px rgba(4, 32, 54, 0.22);
  border-radius: 18px;
}
.glass-soft {
  background-color: var(--glass-soft);
  background-image: linear-gradient(112deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0) 52%);
  -webkit-backdrop-filter: blur(5px) saturate(170%) brightness(1.04);
  backdrop-filter: blur(5px) saturate(170%) brightness(1.04);
  border: 1px solid var(--border);
  box-shadow:
    inset 0 1px 0 var(--spec-mid),
    inset 0 -1px 0 rgba(255, 255, 255, 0.10),
    inset 2px 0 6px -2px rgba(56, 178, 199, 0.16),
    inset -2px 0 6px -2px rgba(240, 138, 75, 0.12),
    0 6px 16px rgba(4, 32, 54, 0.10);
  border-radius: 14px;
}
.glass-pill {
  background-color: var(--glass);
  background-image: var(--glass-sheen);
  -webkit-backdrop-filter: blur(6px) saturate(180%) brightness(1.05);
  backdrop-filter: blur(6px) saturate(180%) brightness(1.05);
  border: 1px solid var(--border);
  box-shadow:
    inset 0 1px 0 var(--spec-hi),
    inset 0 -1px 0 rgba(255, 255, 255, 0.22),
    inset 1px 0 0 rgba(255, 255, 255, 0.20),
    inset -1px 0 0 rgba(255, 255, 255, 0.11),
    inset 3px 0 7px -3px rgba(56, 178, 199, 0.28),
    inset -3px 0 7px -3px rgba(240, 138, 75, 0.20),
    inset 0 12px 16px -10px rgba(255, 255, 255, 0.30),
    inset 0 -10px 14px -10px rgba(31, 78, 110, 0.10),
    0 10px 24px rgba(4, 32, 54, 0.16);
  border-radius: 999px;
}
/* 按压高光（对应原项目 InteractiveHighlight）：点按时玻璃被「压亮」，松开恢复 */
.glass, .glass-strong, .glass-pill, .glass-soft { transition: box-shadow 0.25s ease, background-color 0.25s ease, filter 0.18s ease; }
button.glass-pill:active, a.glass-pill:active, button.glass-soft:active { filter: brightness(1.08) saturate(1.06); }
.glass-on {
  background: linear-gradient(165deg, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0) 48%), var(--accent);
  color: var(--accent-ink);
  border-color: rgba(255, 255, 255, 0.55);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.65),
    inset 0 -1px 0 rgba(255, 255, 255, 0.25),
    inset 0 -10px 18px rgba(0, 0, 0, 0.14),
    0 10px 22px rgba(6, 60, 70, 0.28);
}
/* 长列表卡片：视口外跳过渲染与合成，滚动更流畅（外观不变） */
.cv-card { content-visibility: auto; contain-intrinsic-size: auto 190px; }
/* ===== 底部导航液态玻璃放大透镜（参照 Kyant AndroidLiquidGlass / 酷安液态玻璃演示）=====
   一格大小的椭圆透镜：宽 = 单个标签宽、高 ≈ 导航条内高，只罩住一个标签；内装一层与导航条布局
   逐像素对齐的标签克隆（.tab-lens-stage，内边距由 JS 逐项复制导航条），以透镜中心为定点放大
   （倍率上限 1.08，由 lensMeasure 按实测文字宽自适应下调，保证放大文字不出透镜、不压相邻标签）。
   通透：填充为半透明玻璃色（--lens-fill），
   背景色彩能透出，并带 4px 小半径 backdrop 模糊——透镜仅约一格（≈60×56px），这点面积的模糊
   采样开销可控。防重影改走「藏底层」：透镜落位/拖动经过时，JS 给最近的底层标签加 .tab-covered
   淡出其原始图标文字，透镜内只保留放大的克隆一份，不靠不透明填充硬盖；透镜无边框（描边改内
   阴影环），消除 1px 边框造成的克隆层原点偏移。流畅：不挂 SVG 滤镜、无逐帧 JS 弹簧；点选切换
   由 CSS transform 过渡（cubic-bezier 轻微过冲）合成器驱动，拖动跟随（.lens-snap 关过渡）只写 transform。
   已弃用 SVG 位移折射 backdrop-filter——安卓 WebView 快速重绘时会把该滤镜区域画成方形蓝块。 */
:root { --lens-fill: rgba(255, 255, 255, 0.34); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --lens-fill: rgba(255, 255, 255, 0.16); } }
:root[data-theme="dark"] { --lens-fill: rgba(255, 255, 255, 0.16); }
#tabbar { position: relative; touch-action: pan-y; }
#tabbar [data-tab] { z-index: 1; -webkit-tap-highlight-color: transparent; }
#tabbar [data-tab]:focus { outline: none; }
#tabbar [data-tab]:focus-visible { outline: none; box-shadow: inset 0 0 0 2px rgba(56, 178, 199, 0.65); }
/* 被透镜罩住的底层标签：原始图标文字淡出，只留透镜内放大的克隆一份，防两份文字叠成重影 */
#tabbar [data-tab] > * { transition: opacity 0.18s ease; }
#tabbar [data-tab].tab-covered > * { opacity: 0; }
/* 五个标签全部单行等高：文字 nowrap 不折行；字号走 --tab-fs 变量，默认值按最长的
   「国家/地区签证」（7 字）标定，运行时再由 fitTabLabels() 按实测文字宽等比校准——
   真机字体度量与系统字号会让 7 字实际宽度浮动数像素，固定字号时透镜内放大文字
   两侧余量只剩约 2px，首尾字会被透镜边缘切掉（用户实报「字体突出来一部分」）。 */
#tabbar { --tab-fs: 10px; }
@media (min-width: 412px) { #tabbar { --tab-fs: 11px; } }
#tabbar .tab-label {
  white-space: nowrap; font-size: var(--tab-fs); letter-spacing: -0.6px; line-height: 13px; min-height: 13px;
}
@media (min-width: 412px) { #tabbar .tab-label { letter-spacing: -0.5px; } }
.tab-lens {
  position: absolute; left: 0; top: 0; z-index: 2; border-radius: 999px; pointer-events: none;
  overflow: hidden; transform-origin: center center; will-change: transform;
  -webkit-backdrop-filter: blur(4px) saturate(160%) brightness(1.03);
  backdrop-filter: blur(4px) saturate(160%) brightness(1.03);
  background:
    linear-gradient(165deg, rgba(255, 255, 255, 0.30) 0%, rgba(255, 255, 255, 0.07) 46%, rgba(255, 255, 255, 0.02) 72%),
    linear-gradient(0deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0) 42%),
    var(--lens-fill);
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.62),
    inset 0 1px 0 rgba(255, 255, 255, 0.85),
    inset 0 -1px 0 rgba(255, 255, 255, 0.30),
    inset 2px 0 5px -1px rgba(110, 215, 255, 0.55),
    inset -2px 0 5px -1px rgba(255, 150, 195, 0.40),
    inset 0 14px 18px -12px rgba(255, 255, 255, 0.45),
    inset 0 -12px 16px -12px rgba(31, 78, 110, 0.18),
    0 10px 24px rgba(4, 32, 54, 0.22);
  transition: transform 0.45s cubic-bezier(0.22, 1.25, 0.36, 1);
}
/* 透镜运动期间（点选滑动 / 拖动跟随）暂停 backdrop 模糊采样：移动的 backdrop-filter 是逐帧
   重采样，安卓 WebView 上是滑动卡顿的大头；运动中只保留半透明填充与高光（通透感基本不变），
   落位静止后由 JS（transitionend / 超时兜底）撤掉 .lens-moving，恢复 4px 小半径模糊。 */
.tab-lens.lens-moving {
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
/* 平面地图手势进行中：只走根层 transform 合成，高亮层的投影滤镜暂停采样，松手恢复精细渲染 */
#flatCanvas.grabbing { cursor: grabbing; }
.tab-lens-stage {
  position: absolute; left: 0; top: 0; box-sizing: border-box; pointer-events: none;
  display: flex; align-items: stretch; justify-content: space-around;
  transform-origin: 0 0; will-change: transform;
  transition: transform 0.45s cubic-bezier(0.22, 1.25, 0.36, 1);
}
.tab-lens.lens-snap, .tab-lens-stage.lens-snap { transition: none; }
@media (prefers-reduced-motion: reduce) {
  .tab-lens, .tab-lens-stage { transition: none; }
  #tabbar [data-tab] > * { transition: none; }
}
.tab-lens-shade {
  position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background:
    radial-gradient(125% 95% at 50% -12%, rgba(255, 255, 255, 0.40) 0%, rgba(255, 255, 255, 0) 54%),
    linear-gradient(0deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 30%);
  box-shadow:
    inset 0 2px 3px -1px rgba(255, 255, 255, 0.55),
    inset 0 -6px 10px -6px rgba(255, 255, 255, 0.22);
}
/* ===== 主题质感校准（2026-10-23 按用户三份参考定版）=====
   浅色：系统设置页式干净浅色（近白底 #f2f2f5 + 纯白卡，变量已在 :root 换好）+ 酷安浅色视频的
   白色磨砂玻璃：关彩色光晕、卡片阴影去青/橙色散只留中性高光与柔和投影；导航条白色半透明强磨砂，
   透镜白色磨砂（10px 模糊 + 高光描边），透出背景不发灰。
   深色：酷安深色视频式近黑基底（变量已在两处深色块换好：底 #0a0a0c、卡为深灰半透明）+ 深色磨砂
   导航条；透镜提亮一档（中性白填充 + brightness 1.25 + 更强高光描边），带放大与边缘高光。
   透镜克隆层文字/图标统一主题色高亮（.tab-lens-stage [data-tab-clone]），与两份视频里
   「罩住的图标呈主题色」一致；克隆层只有透镜内一格可见，其余被透镜 overflow 裁掉。
   类级覆盖须写两遍：显式 data-theme 与跟随系统（prefers-color-scheme）两条生效路径。
   注意：scoped .tab-lens 的特异性高于 .tab-lens.lens-moving，故每档另补一条 lens-moving 规则，
   保证「运动期间暂停透镜 backdrop 模糊」的流畅防线不被覆盖掉。 */
.tab-lens-stage [data-tab-clone] { color: var(--accent); }
:root[data-theme="light"] { --radius: 24px; }
:root[data-theme="light"] .scene-blob { display: none; }
:root[data-theme="light"] .glass { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 1px 2px rgba(16, 24, 40, 0.04), 0 10px 28px rgba(16, 24, 40, 0.07); }
:root[data-theme="light"] .glass-soft { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 4px 14px rgba(16, 24, 40, 0.05); }

。练习要点：回答短、具体、与 DS-160 一致，先给结论再给一句证据。","questions":[{"q":"你去美国做什么？","qEn":"What is the purpose of your trip to the United States?","focus":"旅行目的真实性","tip":"一句话说清：旅游观光 + 具体城市。别说「随便看看」，别提找工作、读书、移民。"},{"q":"你打算去哪些城市、待多久？","qEn":"Which cities will you visit and how long will you stay?","focus":"行程合理性","tip":"按行程单回答：日期、城市、代表性景点。天数与假期长度要匹配，10–15 天最常见。"},{"q":"你做什么工作？收入多少？","qEn":"What do you do for a living? How much do you earn?","focus":"国内约束力核心","tip":"职位 + 司龄 + 年收入，与在职证明、DS-160 完全一致。这是权重最高的问题之一。"},{"q":"你结婚了吗？家人去不去？","qEn":"Are you married? Is your family traveling with you?","focus":"家庭约束力","tip":"如实说。配偶/孩子留在国内是强约束力；全家出行则更要讲清国内的房产与工作安排。"},{"q":"你在美国有亲戚或朋友吗？","qEn":"Do you have any relatives or friends in the US?","focus":"诚实度 + 滞留风险","tip":"必须如实申报，与 DS-160 填写一致。隐瞒被查出比有亲戚本身严重得多。"},{"q":"谁来承担这次旅行的费用？","qEn":"Who will pay for this trip?","focus":"经济能力","tip":"自费就亮工资与存款逻辑；他人资助要能说清关系与对方的支付能力。"},{"q":"你去过哪些国家？","qEn":"Which countries have you visited?","focus":"旅行信用记录","tip":"按旧护照记录说，发达国家记录是加分项；没出过国也别慌，用稳定的工作与资产补足。"},{"q":"为什么选择现在去美国？","qEn":"Why do you want to go now?","focus":"动机自然度","tip":"绑定具体契机：年假、展会、球赛、国家公园季节。越具体越可信。"},{"q":"你在国内有房产吗？","qEn":"Do you own any property in China?","focus":"资产约束力","tip":"有就直接答并备好房产证；没有就用长期工作、家庭、社保等其他约束补位，不要编造。"},{"q":"旅行结束后你有什么计划？","qEn":"What are your plans after returning to China?","focus":"回国意图收尾","tip":"落到具体事务：回公司接项目、孩子开学、房贷车贷。让「回来」成为默认选项。"}]},"schengen":{"id":"schengen","title":"申根签证电调/约谈模拟","countryLabel":"申根区","intro":"申根签一般不面谈，但使领馆会电话抽查本人和单位。问题都围绕材料真实性：行程、酒店、工作，一个都不能记错。","questions":[{"q":"你这次去欧洲的行程是怎样的？","qEn":"What is your itinerary for this trip to Europe?","focus":"行程单熟悉度","tip":"按行程单顺序说：几号到哪个城市、住哪、玩什么。自己做的行程才能脱口而出。"},{"q":"为什么选择这个国家作为申请国？","qEn":"Why did you choose this country as the one to apply to?","focus":"主目的地国规则","tip":"答「停留天数最长」或「第一入境国」，与递交材料一致。"},{"q":"酒店都订好了吗？和谁一起住？","qEn":"Have all your hotels been booked? Who will you be sharing the room with?","focus":"预订单真实性","tip":"说出至少第一晚的酒店名与城市；同行人姓名要与同行材料一致。"},{"q":"你的工作单位是做什么的？你负责什么？","qEn":"What does your employer do? What are your responsibilities there?","focus":"在职真实性","tip":"公司业务、你的岗位、直属上级姓名——电调单位前台时也要能对上。"},{"q":"这次旅行预算大概多少？谁出钱？","qEn":"What is your approximate budget for this trip? Who is paying for it?","focus":"资金匹配度","tip":"给出与流水余额匹配的总预算数字，别报一个余额覆盖不了的豪华行程。"},{"q":"以前去过欧洲吗？有没有被拒签过？","qEn":"Have you been to Europe before? Have you ever been refused a visa?","focus":"历史诚实度","tip":"拒签史必须如实说，各国信息互通，隐瞒等于自杀式申请。"}]},"uk":{"id":"uk","title":"英国访客签问询模拟","countryLabel":"英国","intro":"英签以材料审理为主，签证中心录指纹时可能简短问询，UKVI 也可能电话回访。核心三问：钱从哪来、为什么去、为什么会回。","questions":[{"q":"你去英国的主要目的是什么？","qEn":"What is the main purpose of your visit to the UK?","focus":"目的清晰度","tip":"旅游就说旅游：城市 + 标志性安排。探亲要能说清亲属关系与对方在英身份。"},{"q":"你的月收入是多少？存款有多少？","qEn":"What is your monthly income? How much do you have in savings?","focus":"财务一致性","tip":"数字必须与流水、在职证明对得上；签证官会自己算你的旅行成本占比。"},{"q":"这次旅行预计花多少钱？","qEn":"How much do you expect to spend on this trip?","focus":"消费合理性","tip":"给出机票+酒店+日常的拆分预算，与收入水平相称，别让旅行花掉全部积蓄。"},{"q":"你请了多少天假？单位知道吗？","qEn":"How many days of leave have you taken? Does your employer know about it?","focus":"在职真实性","tip":"答出准假起止日期，与在职证明一致；回访单位时 HR 要能确认。"},{"q":"在英国有亲友吗？住在哪里？","qEn":"Do you have any relatives or friends in the UK? Where will you be staying?","focus":"住宿落实度","tip":"住酒店报酒店名；住亲友家要能提供地址与邀请人信息，且与申请表一致。"}]},"generic":{"id":"generic","title":"通用入境问询模拟","countryLabel":"各国入境柜台","intro":"免签/落地签国家没有面签，但入境柜台的几句话同样能决定放行。提前练熟这组问答，落地不慌。","questions":[{"q":"你来我们国家做什么？","qEn":"What is the purpose of your visit?","focus":"目的声明","tip":"一句 Tourism 就够，加上城市名。别提工作、打工、长住。"},{"q":"你待几天？什么时候离开？","qEn":"How long will you stay? When do you leave?","focus":"停留合规","tip":"报出离境日期并出示返程机票：在免签天数之内是关键。"},{"q":"你住在哪里？","qEn":"Where will you be staying?","focus":"住宿落实","tip":"说出酒店名与城市，打开订单给他看；住民宿要能提供地址。"},{"q":"你带了多少钱？","qEn":"How much money do you have with you?","focus":"资金抽查","tip":"如实说现金 + 银行卡。部分国家有最低现金要求（如泰国抽查），提前备好。"},{"q":"你是一个人旅行吗？","qEn":"Are you traveling alone?","focus":"同行关系","tip":"如实回答；同行人就在附近时指给他看，信息要互相对得上。"}]},"au":{"id":"au","title":"澳大利亚访客签电调模拟","countryLabel":"澳大利亚","intro":"澳签无面谈，但电调是真门槛：签证官/中文电调会核对工作、行程与资金。本人、单位、配偶都可能接到电话，口径必须一致。","questions":[{"q":"你去澳大利亚的行程怎么安排？","qEn":"How have you planned your itinerary in Australia?","focus":"行程熟悉度","tip":"按行程单说城市、日期、代表景点。天数要与准假时长一致。"},{"q":"你在哪个单位工作？岗位和月薪是多少？","qEn":"Where do you work? What is your position and monthly salary?","focus":"在职真实性","tip":"与在职证明逐字一致；提前提醒 HR/前台电调时怎么确认。"},{"q":"这次旅行预算多少？存款够吗？","qEn":"What is your budget for this trip? Are your savings sufficient?","focus":"资金匹配","tip":"给出总预算与流水逻辑，别临存大额无解释。"},{"q":"同行人是谁？你们什么关系？","qEn":"Who is traveling with you? What is your relationship to them?","focus":"同行真实性","tip":"姓名、关系、对方职业都能说清；分开电调时最容易露馅。"},{"q":"为什么这次想去澳大利亚？以前出过国吗？","qEn":"Why do you want to visit Australia this time? Have you traveled abroad before?","focus":"动机与记录","tip":"绑定具体契机；白本就用稳定工作与资产补足，不编旅行史。"},{"q":"回国后有什么安排？","qEn":"What are your plans after returning to China?","focus":"回国约束力","tip":"落到工作交接、项目节点、家庭事务，让回国成为必然。"}]},"ca":{"id":"ca","title":"加拿大访客签问询模拟","countryLabel":"加拿大","intro":"加签纯材料审理，问询多出现在补件说明与极少数面试。核心是把「为什么去、钱哪来、为什么回」写成闭环，这组题按审理视角练。","questions":[{"q":"你去加拿大的具体目的是什么？","qEn":"What is the specific purpose of your trip to Canada?","focus":"目的具体化","tip":"城市+活动+日期，别只写 tourism；探亲要写清邀请人身份与关系。"},{"q":"你的资金能覆盖全程吗？来源是什么？","qEn":"Can your funds cover the entire trip? What is the source of these funds?","focus":"资金来源","tip":"工资流水为主线，大额存款逐笔给来源说明。"},{"q":"你在国内的工作与家庭情况？","qEn":"Tell me about your job and your family situation in China.","focus":"约束力体系","tip":"工作年限、职位、配偶/子女、房产成套呈现，与表格一致。"},{"q":"有美签或去过加拿大吗？","qEn":"Do you have a US visa, or have you ever been to Canada?","focus":"CAN+ 与记录","tip":"有就突出：可走简化通道且是强信用记录；没有也不隐瞒。"},{"q":"行程结束后为什么一定会回国？","qEn":"Why will you definitely return to China after your trip?","focus":"回国意图","tip":"用准假结束日、在研项目、家庭责任收尾，具体到日期。"}]},"ru":{"id":"ru","title":"俄罗斯签证/入境问询模拟","countryLabel":"俄罗斯","intro":"俄罗斯电子签无面谈，贴纸签与入境边检会核对行程、住宿与登记。重点练边检问询与材料一致性。","questions":[{"q":"你来俄罗斯去哪些城市、住哪里？","qEn":"Which cities will you visit in Russia, and where will you stay?","focus":"行程与住宿","tip":"说出酒店名与城市，与电子签填表信息一致；换酒店要保留新订单。"},{"q":"你停留多少天？离境航班是哪班？","qEn":"How many days will you stay? Which flight will you take to leave?","focus":"停留合规","tip":"电子签严守 16 天上限，报出确切离境日期。"},{"q":"你从事什么工作？这次是旅游还是公务？","qEn":"What do you do for a living? Is this trip for tourism or business?","focus":"目的定性","tip":"一词定性并与签证类型对应，别把商务活动说成旅游。"},{"q":"入境后住宿登记办了吗？（回访/抽查）","qEn":"Have you completed your accommodation registration after entering Russia?","focus":"落地登记","tip":"答酒店代办并出示登记条照片；民宿要房东配合办理。"}]},"in":{"id":"in","title":"印度签证问询模拟","countryLabel":"印度","intro":"印度纸质签以材料审理为主，递交与入境时问询较细，且对职业、去过地区、行程细节敏感。练的是具体与一致。","questions":[{"q":"你去印度哪些城市？逐日行程是什么？","qEn":"Which cities will you visit in India? What is your day-by-day itinerary?","focus":"行程细节","tip":"城市、交通、酒店逐日能说清；敏感地区行程更要坦诚具体。"},{"q":"你从事什么职业？单位做什么业务？","qEn":"What is your occupation? What business does your employer do?","focus":"职业敏感度","tip":"如实具体：媒体、科研、NGO 等职业会被细问，提前准备说明信。"},{"q":"以前去过印度或巴基斯坦等地区吗？","qEn":"Have you ever visited India, Pakistan, or nearby regions before?","focus":"历史申报","tip":"与申请表申报完全一致，隐瞒旧签证/出入境记录最致命。"},{"q":"在印度有联系人吗？住在哪里？","qEn":"Do you have any contacts in India? Where will you be staying?","focus":"在印联系","tip":"酒店就报酒店；住友人家要能提供姓名、地址、电话且与表格一致。"},{"q":"旅行费用由谁承担？","qEn":"Who will bear the cost of this trip?","focus":"资金承担","tip":"自费亮流水逻辑；公司承担备好派遣与承担函。"}]},"study":{"id":"study","title":"留学签证通用模拟","countryLabel":"留学（通用）","intro":"学生签各国共通的审理逻辑：学校与专业是真的、钱是够的、学成计划是合理的、没有借留学之名滞留。按这条线练。","questions":[{"q":"你去哪所学校读什么专业？为什么选它？","qEn":"Which school will you attend and what will you study? Why did you choose it?","focus":"选校合理性","tip":"说出课程设置、排名/特色与你的背景衔接，别只答「名气大」。"},{"q":"为什么不留在国内读同类专业？","qEn":"Why not study a similar program in China instead?","focus":"留学必要性","tip":"对比具体差异：课程、实验室、行业机会，落到你的职业目标。"},{"q":"学费和生活费由谁承担？他们的收入如何？","qEn":"Who will pay for your tuition and living expenses? What is their income?","focus":"资助能力","tip":"资助人职业、年收入、存款与流水成套，数字与材料一致。"},{"q":"毕业后有什么计划？","qEn":"What are your plans after graduation?","focus":"学成计划","tip":"给出具体行业/岗位路径；涉及移民政策如实按规则答，不承诺也不回避。"},{"q":"语言成绩/学术背景够吗？衔接课程怎么安排？","qEn":"Are your language scores and academic background sufficient? How is your pathway course arranged?","focus":"学习能力","tip":"成绩、预科/语言班路径说清，证明你能读下来而不是混身份。"},{"q":"以前被拒签过吗？这次有什么不同？","qEn":"Have you ever been refused a visa before? What is different this time?","focus":"拒签史诚实度","tip":"如实说并指出已改善的点（资金、材料、约束），隐瞒必被查出。"}]},"business":{"id":"business","title":"商务签证通用模拟","countryLabel":"商务（通用）","intro":"商务签的核心是活动真实、邀请方可核、公司业务对得上、不会抢当地就业。邀请函上的每个细节都可能被追问。","questions":[{"q":"你去对方国家参加什么商务活动？","qEn":"What business activity will you take part in there?","focus":"活动真实性","tip":"会议/展会/拜访名称、日期、地点与邀请函逐字一致。"},{"q":"邀请方是什么公司？和你们什么关系？","qEn":"Who is the inviting company? What is your relationship with them?","focus":"邀请方可核性","tip":"合作历史、订单/合同往来能说清，官网与联系人可查证。"},{"q":"你在公司负责什么？为什么派你去？","qEn":"What are your responsibilities at your company? Why were you chosen for this trip?","focus":"派员合理性","tip":"岗位与活动主题对应：技术谈判派工程师、签约派负责人。"},{"q":"费用由谁承担？行程几天？","qEn":"Who will cover the expenses? How many days will the trip last?","focus":"费用与行程","tip":"公司承担备派遣函；天数与活动日程匹配，别多出大段空白旅游期无解释。"},{"q":"活动结束后你的回国安排？","qEn":"What are your arrangements for returning to China after the event?","focus":"回国约束","tip":"落到复命、项目交付节点，商务签最忌被怀疑滞留务工。"}]}},"ARRIVAL_GUIDES":{"jp":{"id":"jp","country":"日本","title":"Visit Japan Web 入境手续","kind":"online","timing":"出发前注册填报，生成二维码；建议起飞前 6 小时完成","officialUrl":"https://www.vjw.digital.go.jp","officialLabel":"Visit Japan Web 官网","fields":[{"label":"姓（拼音大写）","en":"Family Name","profileKey":"surname","hint":"与护照机读区一致，如 ZHANG"},{"label":"名（拼音大写）","en":"Given Name","profileKey":"givenNames","hint":"如 WEI，不要加空格或连字符"},{"label":"出生日期","en":"Date of Birth","profileKey":"dateOfBirth","hint":"按护照：年/月/日"},{"label":"国籍","en":"Nationality","profileKey":"nationality","hint":"选 CHINA"   return null;
}
function policyText(code) { return policyBadge(code); }
function profileValue(p, key) {
  if (key === "fullNameEn") return [p.surname, p.givenNames].filter(Boolean).join(" ");
  const v = p[key];
  return typeof v === "string" ? v : "";
}
function profileCompleteness(p) {
  const core = ["surname", "givenNames", "dateOfBirth", "passportNo", "passportExpiry", "nationality"];
  const filled = core.filter((k) => profileValue(p, k).trim().length > 0).length;
  return Math.round((filled / core.length) * 100);
}
const SCHENGEN_LIST = ["at","be","bg","hr","cz","dk","ee","fi","fr","de","gr","hu","is","it","lv","li","lt","lu","mt","nl","no","pl","pt","ro","sk","si","es","se","ch"];
function bankForCountry(code) {
  if (code === "us") return BANKS.us;
  if (code === "gb") return BANKS.uk;
  if (code === "au") return BANKS.au;
  if (code === "ca") return BANKS.ca;
  if (code === "ru") return BANKS.ru;
  if (code === "in") return BANKS.in;
  if (SCHENGEN_LIST.includes(code)) return BANKS.schengen;
  return BANKS.generic;
}
function scoreAnswer(answer) {
  const a = answer.trim();
  const fb = [];
  let score = 50;
  if (a.length === 0) return { score: 0, feedback: ["还没有作答。先开口说出来，模拟的价值就在于暴露问题。"] };
  if (a.length < 8) { score -= 15; fb.push("太短了：签证官需要至少一个具体信息（数字、日期、名称），一句话里给一个。"); }
  else if (a.length <= 120) { score += 20; fb.push("长度合适：面谈回答以 1–3 句、信息密度高为佳。"); }
  else { score -= 5; fb.push("有点长：面谈不是演讲，长答案容易说出与材料矛盾的细节。试着砍掉一半。"); }
  if (/\d/.test(a)) { score += 12; fb.push("有具体数字/日期，可信度加分。"); } else { fb.push("试着加入一个具体数字：天数、金额、年份都行。"); }
  if (/(工作|公司|单位|学校|上学|职位|项目)/.test(a)) { score += 10; fb.push("提到了国内的工作/学业约束，这是签证官最想听的。"); }
  if (/(移民|定居|留下来|找工作|打工|黑下来)/.test(a) && !/(不|没|不会)/.test(a)) { score -= 30; fb.push("⚠️ 出现了移民/务工倾向的表述且没有否定，这是面谈的大忌。"); }
  if (/(不知道|不清楚|随便|看情况|还没定)/.test(a)) { score -= 15; fb.push("⚠️ 「还没定/不清楚」会显得行程不真实，出发前把行程定死再背熟。"); }
  if (/(回来|回国|返程|回公司|销假)/.test(a)) { score += 8; fb.push("主动点明回国安排，约束力表达完整。"); }
  return { score: Math.max(5, Math.min(98, score)), feedback: fb };
}

/* 液态玻璃下拉 */
function createGlassSelect(opts) {
  let value = opts.value || "";
  let open = false, q = "";
  const root = el('<div class="relative"></div>');
  function render() {
    const current = opts.options.find((o) => o.value === value);
    const kw = q.trim().toLowerCase();
    let shown;
    if (!kw) shown = opts.options;
    else if (opts.rankFn) {
      const scored = [];
      opts.options.forEach((o, i) => { const s = opts.rankFn(o, kw); if (s >= 0) scored.push([s, i, o]); });
      scored.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      shown = scored.map((x) => x[2]);
    } else shown = opts.options.filter((o) => {
      if (o.label.toLowerCase().includes(kw)) return true;
      const en = (o.sub || "").toLowerCase();
      if (kw.length > 2 && en && en.includes(kw)) return true;
      return (o.tokens || []).some((t) => t === kw || t.startsWith(kw));
    });
    const optHTML = (o) => {
      const fl = opts.showFlags && o.value && flagSprite(o.value) ? flagHTML(o.value, o.label, "w-8") : "";
      return '<button type="button" role="option" aria-selected="' + (o.value === value) + '" data-val="' + esc(o.value) + '" class="block w-full whitespace-normal break-words rounded-xl px-3 py-2.5 text-left text-sm leading-snug transition ' + (o.value === value ? "bg-[var(--accent)] font-bold" : "hover:bg-white/30") + '"' + (o.value === value ? ' style="color:var(--accent-ink)"' : "") + ">" + (fl ? '<span class="flex items-start gap-2.5">' + fl + '<span class="min-w-0 flex-1">' : "") + '<span class="block">' + esc(o.label) + "</span>" + (o.sub ? '<span class="block text-[11px] font-medium leading-snug" style="opacity:.68">' + esc(o.sub) + "</span>" : "") + (fl ? "</span></span>" : "") + "</button>";
    };
    root.innerHTML =
      '<button type="button" aria-haspopup="listbox" aria-expanded="' + open + '" aria-label="' + esc(opts.ariaLabel) + '" class="glass-pill flex w-full items-center justify-between gap-2 px-4 py-2.5 text-left text-sm active:scale-[0.99]" data-act="toggle">' +
      (opts.showFlags && current && flagSprite(current.value) ? flagHTML(current.value, current.label, "w-7") : "") +
      '<span class="min-w-0 flex-1 truncate ' + (current ? "font-semibold" : "text-[var(--dim)]") + '">' + esc(current ? current.label : opts.placeholder) + '</span>' +
      '<span aria-hidden="true" class="shrink-0 text-xs text-[var(--dim)] transition-transform' + (open ? " rotate-180" : "") + '">▾</span></button>' +
      (open ? '<div class="glass-menu mt-2 overflow-hidden p-2" role="listbox" aria-label="' + esc(opts.ariaLabel) + '">' +
        '<input type="text" aria-label="在选项中搜索" placeholder="搜索…" class="glass-input w-full px-3 py-2 text-sm" data-role="q" value="' + esc(q) + '" />' +
        '<div class="mt-1.5 max-h-60 overflow-y-auto pr-0.5">' +
        shown.map(optHTML).join("") +
        (shown.length === 0 ? '<p class="px-3 py-2 text-sm text-[var(--dim)]">没有匹配的选项</p>' : "") +
        "</div></div>" : "");
    const qInput = root.querySelector('[data-role="q"]');
    if (qInput) {
      qInput.addEventListener("input", () => { q = qInput.value; render(); const nq = root.querySelector('[data-role="q"]'); nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length); });
      qInput.addEventListener("click", (ev) => ev.stopPropagation());
    }
    root.querySelectorAll("[data-val]").forEach((b) => b.addEventListener("click", () => {
      value = b.getAttribute("data-val"); open = false; render(); opts.onChange(value);
    }));
    root.querySelector('[data-act="toggle"]').addEventListener("click", () => { open = !open; if (open) q = ""; render(); });
  }
  const onDoc = (e) => { if (open && !root.contains(e.target)) { open = false; render(); } };
  const onKey = (e) => { if (open && e.key === "Escape") { open = false; render(); } };
  document.addEventListener("pointerdown", onDoc);
  document.addEventListener("keydown", onKey);
  render();
  return { root, getValue: () => value, setValue: (v) => { value = v; render(); } };
}

/* 液态玻璃日期选择 */
function createGlassDatePicker(opts) {
  let value = opts.value || "";
  let open = false;
  const today = new Date();
  const root = el('<div class="relative"></div>');
  function parse(v) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v); return m ? { y: +m[1], mo: +m[2], d: +m[3] } : null; }
  let sel = parse(value);
  let cursor = { y: sel ? sel.y : today.getFullYear(), mo: sel ? sel.mo : today.getMonth() + 1 };
  const fmt = (y, mo, d) => y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  function render() {
    sel = parse(value);
    const display = sel ? sel.y + "年" + sel.mo + "月" + sel.d + "日" : "";
    let cal = "";
    if (open) {
      const first = new Date(cursor.y, cursor.mo - 1, 1);
      const lead = (first.getDay() + 6) % 7;
      const days = new Date(cursor.y, cursor.mo, 0).getDate();
      const cells = [];
      for (let i = 0; i < lead; i++) cells.push(null);
      for (let d = 1; d <= days; d++) cells.push(d);
      while (cells.length % 7 !== 0) cells.push(null);
      cal = '<div class="glass-menu mt-2 p-3" role="dialog" aria-label="' + esc(opts.ariaLabel) + '" style="width:100%;box-sizing:border-box">' +
        '<div class="flex items-center justify-between">' +
        '<button type="button" aria-label="上个月" data-act="prev" class="glass-pill flex items-center justify-center text-sm font-black" style="height:32px;width:32px">‹</button>' +
        '<span class="font-display text-sm font-bold">' + cursor.y + " 年 " + cursor.mo + " 月</span>" +
        '<button type="button" aria-label="下个月" data-act="next" class="glass-pill flex items-center justify-center text-sm font-black" style="height:32px;width:32px">›</button></div>' +
        '<div class="mt-2 grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-[var(--dim)]" style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px">' + ["一","二","三","四","五","六","日"].map((w) => '<span style="display:flex;align-items:center;justify-content:center;height:22px">' + w + "</span>").join("") + "</div>" +
        '<div class="mt-1 grid grid-cols-7 gap-1" style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px">' + cells.map((d) => {
          if (d === null) return '<span style="height:36px"></span>';
          const isSel = sel && sel.y === cursor.y && sel.mo === cursor.mo && sel.d === d;
          const isToday = today.getFullYear() === cursor.y && today.getMonth() + 1 === cursor.mo && today.getDate() === d;
          return '<button type="button" data-day="' + d + '" aria-label="' + cursor.y + "年" + cursor.mo + "月" + d + '日" aria-pressed="' + !!isSel + '" class="flex items-center justify-center rounded-full text-sm transition ' + (isSel ? "btn-primary font-black" : "hover:bg-white/30") + (isToday && !isSel ? " ring-1" : "") + '" style="height:36px;width:100%;box-shadow:' + (isToday && !isSel ? "0 0 0 1px var(--accent)" : "none") + '">' + d + "</button>";
        }).join("") + "</div>" +
        '<div class="mt-2 flex gap-2">' +
        '<button type="button" data-act="today" class="glass-pill flex-1 px-3 py-1.5 text-xs font-bold text-[var(--accent)]">今天</button>' +
        (value ? '<button type="button" data-act="clear" class="glass-pill flex-1 px-3 py-1.5 text-xs font-bold text-[var(--bad)]">清除</button>' : "") +
        "</div></div>";
    }
    root.innerHTML =
      '<button type="button" aria-haspopup="dialog" aria-expanded="' + open + '" aria-label="' + esc(opts.ariaLabel) + (display ? "：" + display : "") + '" class="glass-input flex w-full items-center justify-between gap-2 px-3 py-2.5 text-left text-sm active:scale-[0.99]" data-act="toggle">' +
      '<span class="' + (value ? "font-medium" : "text-[var(--dim)]") + '">' + esc(display || opts.placeholder || "选择日期") + '</span>' +
      '<span aria-hidden="true" class="text-[var(--dim)]">📅</span></button>' + cal;
    root.querySelector('[data-act="toggle"]').addEventListener("click", () => {
      open = !open;
      if (open) { const s = parse(value); cursor = { y: s ? s.y : today.getFullYear(), mo: s ? s.mo : today.getMonth() + 1 }; }
      render();
    });
    if (open) {
      root.querySelector('[data-act="prev"]').addEventListener("click", () => { const t = cursor.y * 12 + (cursor.mo - 1) - 1; cursor = { y: Math.floor(t / 12), mo: (t % 12) + 1 }; render(); });
      root.querySelector('[data-act="next"]').addEventListener("click", () => { const t = cursor.y * 12 + (cursor.mo - 1) + 1; cursor = { y: Math.floor(t / 12), mo: (t % 12) + 1 }; render(); });
      root.querySelectorAll("[data-day]").forEach((b) => b.addEventListener("click", () => { value = fmt(cursor.y, cursor.mo, +b.getAttribute("data-day")); open = false; render(); opts.onChange(value); }));
      const tb = root.querySelector('[data-act="today"]'); if (tb) tb.addEventListener("click", () => { value = fmt(today.getFullYear(), today.getMonth() + 1, today.getDate()); open = false; render(); opts.onChange(value); });
      const cb = root.querySelector('[data-act="clear"]'); if (cb) cb.addEventListener("click", () => { value = ""; open = false; render(); opts.onChange(value); });
    }
  }
  const onDoc = (e) => { if (open && !root.contains(e.target)) { open = false; render(); } };
  const onKey = (e) => { if (open && e.key === "Escape") { open = false; render(); } };
  document.addEventListener("pointerdown", onDoc);
  document.addEventListener("keydown", onKey);
  render();
  return { root, getValue: () => value };
}

     网格已恒含全部卡，这一步只切显隐，不重建 DOM */
  applyExploreFilter();

/* 就地筛选：网格恒含全部 306 国卡片；搜索/大洲/只看免签变化时只切换卡片显隐、
   计数与板块显隐，绝不重建 DOM——连点与连续输入都不会再出现整页重绘闪屏 */
function applyExploreFilter() {
  const grid = document.getElementById("expGrid");
  if (!grid) return;
  /* 自愈守卫：若网格卡片数不全（任何整页重渲染曾把筛选子集写进网格），就地筛选
     无卡可恢复——整页重渲染一次（renderExplore 末尾会再回到本函数，此时网格已全）
     再按当前状态筛选，保证清除搜索/切筛选永远能恢复全部国家 */
  if (grid.querySelectorAll("[data-open]").length !== COUNTRIES.length) { renderExplore(); return; }
  const qRaw = exploreState.q.trim();
  const kw = qRaw.toLowerCase();
  const region = exploreState.region, onlyFree = exploreState.onlyFree;
  let visible = 0;
  const rows = [];
  grid.querySelectorAll("[data-open]").forEach((card) => {
    const c = COUNTRIES.find((x) => x.code === card.getAttribute("data-open"));
    let show = !!c;
    let s = 0;
    if (show && region !== "全部" && c.region !== region) show = false;
    if (show && kw) { s = countrySearchScore(c, kw); if (s < 0) show = false; }
    if (show && onlyFree) { const b = policyBadge(c.code) || ""; if (!b.includes("免签") && !b.includes("落地")) show = false; }
    card.classList.toggle("hidden", !show);
    if (show) visible++;
    rows.push([kw ? s : 0, c ? COUNTRIES.indexOf(c) : 9999, card]);
  });
  /* 按打分就地重排已渲染卡片（移动节点不重建、不重载图片）：中文精确 > 代码精确 > 英文名；
     无关键词时按原数据顺序排回，恢复默认列表 */
  rows.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  rows.forEach((r) => grid.appendChild(r[2]));
  const cnt = document.getElementById("expCount");
  if (cnt) cnt.textContent = "共 " + visible + " 个国家/地区（含各国地区旗帜，如英格兰、加州等）";
  const emp = document.getElementById("expEmpty");
  if (emp) emp.classList.toggle("hidden", visible !== 0);
  const showHome = !qRaw && region === "全部";
  const ht = document.getElementById("homeTopWrap"); if (ht) ht.classList.toggle("hidden", !showHome);
  const hp = document.getElementById("homePopularWrap"); if (hp) hp.classList.toggle("hidden", !showHome);
  const hg = document.getElementById("homeGoalsWrap"); if (hg) hg.classList.toggle("hidden", !(showHome || applications.size > 0));
  const qc = document.getElementById("expQClear"); if (qc) qc.classList.toggle("hidden", !qRaw);
  const fb = document.getElementById("expFree");
  if (fb) { fb.setAttribute("aria-pressed", String(onlyFree)); fb.classList.toggle("glass-on", onlyFree); }
  document.querySelectorAll("#panel-explore [data-region]").forEach((b) => {
    const on = b.getAttribute("data-region") === region;
    b.setAttribute("aria-pressed", String(on));
    b.classList.toggle("glass-on", on);
  });
}

function openCountry(code) {
  arrivalOpen = false;
  arrivalReturn = null;
  exploreState.countryCode = code;
  switchTab("explore");
  renderExplore();
  window.scrollTo({ top: 0 });
}

                '<p class="pointer-events-none absolute bottom-1 left-1/2 -translate-x-1/2 whitespace-nowrap rounded-full bg-black/25 px-2.5 py-1 text-[10px] font-semibold text-white">拖动旋转 · 滚轮/双指缩放 · 点国家看政策</p>' +
              "</div>" +
              '<div class="mx-auto mt-2 flex max-w-[540px] flex-wrap items-center gap-x-4 gap-y-2 px-1">' +
                '<div class="flex min-w-[170px] flex-1 items-center gap-2">' +
                  '<button type="button" aria-label="缩小地球仪" id="gzOut" class="glass-pill flex items-center justify-center text-base font-black" style="height:32px;width:32px;flex-shrink:0">－</button>' +
                  '<input type="range" aria-label="地球仪缩放" id="gzRange" min="80" max="300" step="1" value="100" class="glass-range w-full" />' +
                  '<button type="button" aria-label="放大地球仪" id="gzIn" class="glass-pill flex items-center justify-center text-base font-black" style="height:32px;width:32px;flex-shrink:0">＋</button>' +
                "</div>" +
                '<span id="gAutoSlot"></span>' +
                '<button type="button" aria-label="重置地球仪视角" id="gReset" class="glass-pill px-3 py-1.5 text-xs font-bold text-[var(--accent)]">⟲ 回到亚洲</button>' +
              "</div></div>"
            : '<div class="flex aspect-square w-full items-center justify-center text-sm text-[var(--dim)]">正在加载世界轮廓…</div>') +
          "</div>"
        :
          '<div class="relative" id="flatWrap">' +
            '<canvas id="flatCanvas" class="block h-[46vh] min-h-[300px] w-full touch-none select-none sm:h-[54vh]" style="cursor:grab" role="img" aria-label="世界地图：按中国护照签证政策填色的国家轮廓图，可拖动平移、滚轮或双指缩放，点国家看政策"></canvas>' +
            '<div id="flatTip" class="glass-strong pointer-events-none absolute z-10 -translate-x-1/2 whitespace-nowrap px-3 py-1.5 text-xs font-bold hidden" aria-hidden="true"></div>' +
            (!mapState.flatFeatures ? '<div class="absolute inset-0 flex items-center justify-center text-sm text-[var(--dim)]">正在加载世界轮廓…</div>' : "") +
            '<div class="absolute right-2 top-2 flex flex-col gap-1.5">' +
              '<button type="button" aria-label="放大地图" id="fzIn" class="glass-pill flex items-center justify-center text-lg font-black" style="height:36px;width:36px">＋</button>' +
              '<button type="button" aria-label="缩小地图" id="fzOut" class="glass-pill flex items-center justify-center text-lg font-black" style="height:36px;width:36px">－</button>' +
              '<button type="button" aria-label="重置地图视角" id="fzReset" class="glass-pill flex items-center justify-center text-sm font-black" style="height:36px;width:36px">⟲</button>' +
            "</div>" +
            '<p class="absolute bottom-2 left-2 rounded-full bg-black/25 px-2.5 py-1 text-[10px] font-semibold text-white" style="margin:0">拖动平移 · 滚轮/双指缩放 · 点国家看政策</p>' +
          "</div>")
      :
        '<div class="p-4"><p class="text-sm font-semibold" style="margin:0">地图轮廓加载失败，已切换为分组列表（数据完整）</p><p class="mt-1 text-xs text-[var(--dim)]">点任意国家同样可查看政策小卡并进入详情页。</p></div>') +
    "</section>" +
    (mapSelCardHTML() || mapSelHintHTML()) +
    (mapState.failed ?
      '<section class="space-y-4" aria-label="按政策分组的国家列表">' +
      CAT_META.map((m) => {
        const rows = mapGrouped().get(m.id) || [];
        if (rows.length === 0) return "";
        if (mapState.filter && mapState.filter !== m.id) return "";
        return '<div><h2 class="font-display mb-2 flex items-center gap-2 text-base font-bold" style="margin-top:0"><span class="inline-block h-3.5 w-3.5 rounded-[4px]" style="background:' + m.color + ';box-shadow:0 0 0 1px rgba(0,0,0,0.15)" aria-hidden="true"></span>' + m.label + " · " + rows.length + ' 个</h2>' +
          '<div class="flex flex-wrap gap-1.5">' + rows.map((c) => '<button type="button" data-grouppick="' + c.code + '" aria-label="查看' + esc(c.zh) + '签证政策" class="glass-pill px-3 py-1.5 text-xs font-semibold' + (sel === c.code ? " ring-2" : "") + '">' + esc(c.zh) + "</button>").join("") + "</div></div>";
      }).join("") + "</section>" : "") +
    '<section class="glass p-3.5" aria-label="政策分类统计">' +
      '<span class="block text-xs font-bold text-[var(--dim)]">中国护照可达性统计</span>' +
      '<div class="mt-2 grid grid-cols-2 gap-2">' +
      CAT_META.map((m) => '<span class="glass-pill flex items-center gap-1.5 px-3 py-2 text-xs font-bold" style="justify-self:start"><span class="inline-block h-3 w-3 rounded-[4px]" style="background:' + m.color + ';box-shadow:0 0 0 1px rgba(0,0,0,0.15)" aria-hidden="true"></span>' + m.label + " <span>" + counts[m.id] + "</span></span>").join("") +
      "</div>" +
      '<span class="mt-2 block text-[10px] leading-relaxed text-[var(--dim)]">共 ' + (counts.free + counts.arrival + counts.evisa + counts.pre + counts.nodata) + ' 个国家/地区 · 与「国家签证」列表同一份数据（2026 年 10 月核对）；本数据集未单列 ETA 与禁止入境类别，故不显示这两项。</span></section>' +
  "</div>";

  /* 事件接线 */
  panel.querySelectorAll("[data-cat]").forEach((b) => b.addEventListener("click", () => {
    const id = b.getAttribute("data-cat");
    mapState.filter = mapState.filter === id ? null : id;
    if (mapState.globe) mapState.globe.setFilter(mapState.filter);
    renderMapSoft();
  }));
  const cf = document.getElementById("mapClearFilter");
  if (cf) cf.addEventListener("click", clearMapFilter);
  panel.querySelectorAll("[data-vmode]").forEach((b) => b.addEventListener("click", () => { const m = b.getAttribute("data-vmode"); if (m === mapState.viewMode) return; mapState.viewMode = m; renderMap(); }));
  /* 占位文案只作选择器按钮的 placeholder，不再作为选项行重复出现在下拉列表里 */
  const selectOptions =
    COUNTRIES.filter((c) => c.code.length === 2 && c.code !== "eu" && c.code !== "un").map((c) => ({
      value: c.code,
      label: c.zh + " · " + (policyText(c.code) || "无数据/属地"),
      sub: c.en,
      country: c,
      tokens: countrySearchTokens(c),
    }));
  const gsel = createGlassSelect({
    showFlags: true,
    rankFn: (o, kw) => {
      const s = o.country ? countrySearchScore(o.country, kw) : -1;
      if (s >= 0) return s;
      return o.label.toLowerCase().includes(kw) ? 6 : -1;
    },
    ariaLabel: "选择国家查看签证政策", value: sel || "", placeholder: "🔎 选择国家（或直接点地球仪）…", options: selectOptions,
    onChange: (val) => {
      const prev = mapState.selected;
      mapState.selected = val || null;
      renderMapSoft();
      if (val && val !== prev) {
        if (mapState.viewMode === "globe" && mapState.globe) mapState.globe.flyTo(val);
        else if (mapState.viewMode === "flat" && mapState.flat) mapState.flat.flyTo(val);
      }
    },
  });
  document.getElementById("mapSelectSlot").appendChild(gsel.root);
  mapState.selectWidget = gsel;
  wireMapSelectionUI();
  panel.querySelectorAll("[data-grouppick]").forEach((b) => b.addEventListener("click", () => { mapState.selected = b.getAttribute("data-grouppick"); renderMapSoft(); }));

  if (!mapState.failed && mapState.viewMode === "globe" && mapState.globeFeatures) {
    const canvas = document.getElementById("globeCanvas");
    const wrap = document.getElementById("globeWrap");
    const tip = document.getElementById("globeTip");
    if (mapState.flat) { mapState.flat.destroy(); mapState.flat = null; }
    if (mapState.globe) mapState.globe.destroy();
    mapState.globe = createGlobe(canvas, wrap, {
      features: mapState.globeFeatures,
      onPick: (code) => { mapState.selected = code; if (mapState.globe) mapState.globe.setSelected(code); renderMapSoft(); },
      onHover: (code, x, y) => {
        if (code) {
          const c = COUNTRIES.find((cc) => cc.code === code);
          const r = wrap.getBoundingClientRect();
          tip.textContent = c ? c.zh + " · " + CAT_LABEL[catOf(code)] : code;
          tip.style.left = (x - r.left) + "px";
          tip.style.top = Math.max(0, y - r.top - 46) + "px";
          tip.classList.remove("hidden");
        } else tip.classList.add("hidden");
      },
      onZoom: (z) => {
        const rg = document.getElementById("gzRange");
        if (rg) { rg.value = Math.round(z * 100); rg.style.background = "linear-gradient(90deg, var(--accent) " + (((z - 0.8) / 2.2) * 100) + "%, rgba(140,180,205,0.35) " + (((z - 0.8) / 2.2) * 100) + "%)"; }
      },
    });
    mapState.globe.setFilter(mapState.filter);
    mapState.globe.setSelected(mapState.selected);
    const rg = document.getElementById("gzRange");
    const paintRange = () => { const z = (+rg.value) / 100; rg.style.background = "linear-gradient(90deg, var(--accent) " + (((z - 0.8) / 2.2) * 100) + "%, rgba(140,180,205,0.35) " + (((z - 0.8) / 2.2) * 100) + "%)"; };
    paintRange();
    rg.addEventListener("input", () => { mapState.globe.setZoom((+rg.value) / 100); paintRange(); });
    document.getElementById("gzOut").addEventListener("click", () => { mapState.globe.setZoom(mapState.globe.getZoom() / 1.3); rg.value = Math.round(mapState.globe.getZoom() * 100); paintRange(); });
    document.getElementById("gzIn").addEventListener("click", () => { mapState.globe.setZoom(mapState.globe.getZoom() * 1.3); rg.value = Math.round(mapState.globe.getZoom() * 100); paintRange(); });
    document.getElementById("gReset").addEventListener("click", () => { mapState.globe.reset(); rg.value = 100; paintRange(); });
    const sw = createGlassSwitch(true, (val) => mapState.globe.setAutoRotate(val), "地球仪自动旋转", "自动旋转");
    document.getElementById("gAutoSlot").appendChild(sw.root);
  }

  if (!mapState.failed && mapState.viewMode === "flat" && mapState.flatFeatures) {
    if (mapState.globe) { mapState.globe.destroy(); mapState.globe = null; }
    const canvas = document.getElementById("flatCanvas");
    const wrap = document.getElementById("flatWrap");
    const tip = document.getElementById("flatTip");
    if (mapState.flat) mapState.flat.destroy();
    mapState.flat = createFlatMap(canvas, wrap, {
      features: mapState.flatFeatures,
      geoFeatures: mapState.globeFeatures,
      onPick: (code) => { mapState.selected = code; renderMapSoft(); },
      onHover: (code, x, y) => {
        if (code) {
          const c = COUNTRIES.find((cc) => cc.code === code);
          const r = wrap.getBoundingClientRect();
          tip.textContent = c ? c.zh + " · " + CAT_LABEL[catOf(code)] : code;
          tip.style.left = (x - r.left) + "px";
          tip.style.top = Math.max(0, y - r.top - 46) + "px";
          tip.classList.remove("hidden");
        } else tip.classList.add("hidden");
      },
    });
    document.getElementById("fzIn").addEventListener("click", () => mapState.flat.setZoom(mapState.flat.getZoom() * 1.35));
    document.getElementById("fzOut").addEventListener("click", () => mapState.flat.setZoom(mapState.flat.getZoom() / 1.35));
    document.getElementById("fzReset").addEventListener("click", () => mapState.flat.reset());
  }
}

function wireMapSelectionUI() {
  const sd = document.getElementById("mapSelDetail");
  if (sd) sd.addEventListener("click", () => { if (mapState.selected) openCountry(mapState.selected); });
  const sc = document.getElementById("mapSelClear");
  if (sc) sc.addEventListener("click", () => { mapState.selected = null; if (mapState.globe) mapState.globe.setSelected(null); renderMapSoft(); });
  const cd2 = document.getElementById("mapCardDetail");
  if (cd2) cd2.addEventListener("click", () => { if (mapState.selected) openCountry(mapState.selected); });
}
function clearMapFilter() { mapState.filter = null; if (mapState.globe) mapState.globe.setFilter(null); renderMapSoft(); }

/* 局部刷新：筛选/选中变化只就地更新——图例按钮态、选中条、政策小卡、选择器显示值，
   并通知画布实例改选中/筛选；画布与页面其余 DOM 绝不重建。
   此前 renderMapSoft = 整页 renderMap：连点图例/连点国家时画布被销毁重建，
   整页闪烁重绘（用户录屏实证的地图闪屏源）。 */
function renderMapSoft() {
  const panel = document.getElementById("panel-map");
  if (!panel || !panel.innerHTML || mapState.failed || !document.getElementById("mapCanvasSec")) { renderMap(); return; }
  const counts = mapCounts();
  panel.querySelectorAll("[data-cat]").forEach((b) => {
    const id = b.getAttribute("data-cat");
    const meta = CAT_META.find((m) => m.id === id);
    const active = mapState.filter === id;
    b.setAttribute("aria-pressed", String(active));
    if (meta) b.setAttribute("aria-label", (active ? "取消筛选" : "只高亮") + meta.label + "（" + counts[id] + " 个）");
    b.classList.toggle("ring-2", active);
    b.classList.toggle("opacity-55", !!mapState.filter && !active);
  });
  let cf = document.getElementById("mapClearFilter");
  if (mapState.filter && !cf) {
    const grp = panel.querySelector('[role="group"][aria-label="按签证政策筛选高亮"]');
    if (grp) {
      grp.insertAdjacentHTML("beforeend", '<button type="button" id="mapClearFilter" aria-label="清除筛选，显示全部" class="glass-pill px-3 py-2 text-xs font-bold text-[var(--accent)]" style="justify-self:start">显示全部</button>');
      cf = document.getElementById("mapClearFilter");
      if (cf) cf.addEventListener("click", clearMapFilter);
    }
  } else if (!mapState.filter && cf) cf.remove();
  const canvasSec = document.getElementById("mapCanvasSec");
  const barHTML = mapSelBarHTML();
  const oldBar = document.getElementById("mapSelBar");
  if (barHTML && oldBar) oldBar.outerHTML = barHTML;
  else if (barHTML && canvasSec) canvasSec.insertAdjacentHTML("beforebegin", barHTML);
  else if (!barHTML && oldBar) oldBar.remove();
  const cardHTML = mapSelCardHTML();
  const oldCard = document.getElementById("mapSelCard");
  const oldHint = document.getElementById("mapSelHint");
  if (cardHTML) {
    if (oldHint) oldHint.remove();
    if (oldCard) oldCard.outerHTML = cardHTML;
    else if (canvasSec) canvasSec.insertAdjacentHTML("afterend", cardHTML);
  } else {
    if (oldCard) oldCard.remove();
    const hintHTML = mapSelHintHTML();
    if (hintHTML && !oldHint && canvasSec) canvasSec.insertAdjacentHTML("afterend", hintHTML);
    else if (!hintHTML && oldHint) oldHint.remove();
  }
  wireMapSelectionUI();
  if (mapState.selectWidget) {
    const want = mapState.selected || "";
    if (mapState.selectWidget.getValue() !== want) mapState.selectWidget.setValue(want);
  }
  if (mapState.globe) { mapState.globe.setSelected(mapState.selected); mapState.globe.setFilter(mapState.filter); }
}

/* ---------- 平面地图（与地球仪同一套逻辑） ----------
   单一视图状态 mapState.view = { k, cx, cy }（缩放 + 视图中心的世界坐标），
   rAF 循环逐帧按当前状态重绘整幅图：状态签名不变就跳过本帧（与地球仪 draw 的 sig 机制相同）。
   没有「手势期 transform 图层 + 松手整图重绘提交」的两段式，也没有手势期滤镜开关——
   拖动/缩放/飞达都只是改状态，画面逐帧连续跟随，缩放无台阶、无换层闪帧。
   命中判定与地球仪 codeAt 同一套：港澳标记优先（24 CSS px 内取最近圆心）→
   featureContains 多边形命中（共用地球仪的 polys 数据）→ 小国径向采样兜底。 */
function createFlatMap(canvas, wrap, opts) {
  const st = {
    features: opts.features, geoFeatures: opts.geoFeatures,
    target: null, pointers: new Map(), drag: null, pinch: null, hover: null,
    lastSig: null, active: true, inView: true, w: 0, h: 0,
  };
  const ctx = canvas.getContext("2d");
  function applySize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    const dpr = Math.min(1.75, window.devicePixelRatio || 1);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    st.w = w; st.h = h;
    st.lastSig = null;
  }
  applySize();
  const ro = new ResizeObserver(applySize); ro.observe(canvas);
  const updateActive = () => { st.active = !document.hidden && st.inView; };
  const io = new IntersectionObserver((es) => { st.inView = es[0] ? es[0].isIntersecting : true; updateActive(); }, { threshold: 0.02 });
  io.observe(wrap);
  document.addEventListener("visibilitychange", updateActive);

  const baseS = () => (st.w && st.h ? Math.min(st.w / 1000, st.h / 500) : 0);
  const clampView = (vv) => {
    const k = Math.min(9, Math.max(1, vv.k));
    const s = baseS() * k;
    let cx = vv.cx, cy = vv.cy;
    if (s > 0) {
      const hw = st.w / 2 / s, hh = st.h / 2 / s;
      cx = hw >= 500 ? 500 : Math.min(1000 - hw, Math.max(hw, cx));
      cy = hh >= 250 ? 250 : Math.min(500 - hh, Math.max(hh, cy));
    }
    return { k, cx, cy };
  };
  const toScreen = (wx, wy) => {
    const s = baseS() * mapState.view.k;
    return [(wx - mapState.view.cx) * s + st.w / 2, (wy - mapState.view.cy) * s + st.h / 2];
  };
  const toWorld = (clientX, clientY) => {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    const s = baseS() * mapState.view.k;
    if (!s) return null;
    const px = clientX - rect.left, py = clientY - rect.top;
    return { x: (px - st.w / 2) / s + mapState.view.cx, y: (py - st.h / 2) / s + mapState.view.cy, px, py };
  };

  function paint() {
    const dpr = Math.min(1.75, window.devicePixelRatio || 1);
    const W = st.w, H = st.h;
    const v = mapState.view, flt = mapState.filter, sel = mapState.selected, hov = st.hover;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "rgba(125,180,220,0.25)");
    bg.addColorStop(1, "rgba(125,200,190,0.18)");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    const s = baseS() * v.k;
    const trace = (f) => {
      const path = new Path2D();
      for (const ring of f.ringsXY) {
        for (let i = 0; i < ring.length; i += 2) {
          const sx = (ring[i] - v.cx) * s + W / 2, sy = (ring[i + 1] - v.cy) * s + H / 2;
          if (i === 0) path.moveTo(sx, sy); else path.lineTo(sx, sy);
        }
        path.closePath();
      }
      return path;
    };
    let selPath = null, hovPath = null;
    const framePaths = new Array(st.features.length);
    for (let i = 0; i < st.features.length; i++) {
      const f = st.features[i]; if (!f) continue;
      const path = trace(f);
      framePaths[i] = path;
      const dim = flt !== null && f.cat !== flt;
      ctx.fillStyle = CAT_COLOR[f.cat];
      ctx.globalAlpha = dim ? 0.10 : f.cat === "nodata" ? 0.5 : 0.88;
      ctx.fill(path, "evenodd");
      if (f.code !== null && f.code === sel) selPath = path;
      if (f.code !== null && f.code === hov && f.code !== sel) hovPath = path;
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "rgba(10,26,43,0.88)";
    ctx.lineWidth = Math.max(1.2, W * 0.0022);
    for (const p of framePaths) if (p) ctx.stroke(p);
    ctx.strokeStyle = "rgba(255,255,255,0.95)";
    ctx.lineWidth = Math.max(0.6, W * 0.0011);
    for (const p of framePaths) if (p) ctx.stroke(p);
    if (hovPath) {
      ctx.save();
      ctx.fillStyle = "rgba(255,255,255,0.30)";
      ctx.fill(hovPath, "evenodd");
      ctx.shadowColor = "rgba(255,255,255,0.95)";
      ctx.shadowBlur = W * 0.02;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = Math.max(2.2, W * 0.0042);
      ctx.stroke(hovPath);
      ctx.restore();
    }
    if (selPath) {
      ctx.save();
      ctx.fillStyle = "rgba(255,215,64,0.20)";
      ctx.fill(selPath, "evenodd");
      ctx.shadowColor = "rgba(255,214,64,0.95)";
      ctx.shadowBlur = W * 0.032;
      ctx.strokeStyle = "#ffd740";
      ctx.lineWidth = Math.max(3.2, W * 0.0058);
      ctx.stroke(selPath);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#0d2137";
      ctx.lineWidth = Math.max(1.2, W * 0.0018);
      ctx.stroke(selPath);
      ctx.restore();
    }
    /* 港澳标记圆点：与地球仪同款——质心处画恒定屏幕尺寸的类别色圆点，选中换金色描边并放大。 */
    for (const f of st.features) {
      if (!f.marker) continue;
      const dimM = flt !== null && f.cat !== flt;
      const xy = project(f.centerLng, f.centerLat);
      const sp = toScreen(xy[0], xy[1]);
      if (sp[0] < -30 || sp[0] > W + 30 || sp[1] < -30 || sp[1] > H + 30) continue;
      const isSelM = f.code === sel;
      const rr = Math.max(4.8, W * 0.011) * (isSelM ? 1.3 : 1);
      ctx.save();
      ctx.globalAlpha = dimM ? 0.15 : 1;
      ctx.beginPath(); ctx.arc(sp[0], sp[1], rr, 0, Math.PI * 2);
      ctx.fillStyle = CAT_COLOR[f.cat]; ctx.fill();
      ctx.lineWidth = Math.max(1.4, W * 0.0022);
      ctx.strokeStyle = isSelM ? "#ffd740" : "#ffffff";
      if (isSelM) { ctx.shadowColor = "rgba(255,214,64,0.95)"; ctx.shadowBlur = W * 0.02; }
      ctx.stroke();
      ctx.restore();
    }
  }

  let raf = 0, last = performance.now();
  function draw(now) {
    raf = requestAnimationFrame(draw);
    const dt = Math.min(60, now - last);
    last = now;
    if (!st.active || !st.w) return;
    if (st.target) {
      /* 与地球仪飞达同一缓动：按帧步进逼近目标（中心 + 缩放），到达即停。 */
      const v = mapState.view, t = st.target;
      const step = Math.min(1, dt * 0.007);
      const nv = clampView({ k: v.k + (t.k - v.k) * step, cx: v.cx + (t.cx - v.cx) * step, cy: v.cy + (t.cy - v.cy) * step });
      mapState.view = nv;
      if (Math.abs(t.cx - nv.cx) < 0.4 && Math.abs(t.cy - nv.cy) < 0.4 && Math.abs(t.k - nv.k) < 0.005) {
        mapState.view = clampView(t);
        st.target = null;
      }
    }
    const v = mapState.view;
    const sig = v.cx.toFixed(2) + "|" + v.cy.toFixed(2) + "|" + v.k.toFixed(4) + "|" + mapState.filter + "|" + mapState.selected + "|" + st.hover + "|" + canvas.width + "x" + canvas.height;
    if (sig === st.lastSig) return;
    st.lastSig = sig;
    paint();
  }
  raf = requestAnimationFrame(draw);

  /* 命中判定：与地球仪 codeAt 完全同一套顺序与参数。 */
  function codeAt(clientX, clientY) {
    const wpt = toWorld(clientX, clientY);
    if (!wpt) return null;
    let bestMark = null, bestD = 24;
    for (const f of st.features) {
      if (!f.marker) continue;
      const xy = project(f.centerLng, f.centerLat);
      const sp = toScreen(xy[0], xy[1]);
      const dd = Math.hypot(wpt.px - sp[0], wpt.py - sp[1]);
      if (dd <= bestD) { bestD = dd; bestMark = f.code; }
    }
    if (bestMark) return bestMark;
    const lng = (wpt.x / 1000) * 360 - 180, lat = 90 - (wpt.y / 500) * 180;
    for (const f of st.geoFeatures) if (f.code && featureContains(f, lng, lat)) return f.code;
    const scale = 1 / Math.max(0.35, Math.cos((lat * Math.PI) / 180));
    for (const r of [1.1, 2.2]) {
      for (let a = 0; a < 8; a++) {
        const t = (a / 8) * Math.PI * 2;
        const lo = lng + Math.cos(t) * r * scale, la = lat + Math.sin(t) * r;
        for (const f of st.geoFeatures) if (f.code && featureContains(f, lo, la)) return f.code;
      }
    }
    return null;
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (canvas.setPointerCapture) try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    st.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    st.target = null;
    canvas.classList.add("grabbing");
    if (st.pointers.size === 1) st.drag = { lastX: e.clientX, lastY: e.clientY, moved: 0, startT: performance.now() };
    else if (st.pointers.size === 2) {
      const pts = Array.from(st.pointers.values());
      st.pinch = { dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), k: mapState.view.k };
      st.drag = null;
    }
  });
  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse" && st.pointers.size === 0) {
      const code = codeAt(e.clientX, e.clientY);
      st.hover = code;
      canvas.style.cursor = code ? "pointer" : "grab";
      if (opts.onHover) opts.onHover(code, e.clientX, e.clientY);
    }
    if (!st.pointers.has(e.pointerId)) return;
    st.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (st.pinch && st.pointers.size === 2) {
      const pts = Array.from(st.pointers.values());
      if (st.pinch.dist <= 0) return;
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      mapState.view = clampView({ k: st.pinch.k * (dist / st.pinch.dist), cx: mapState.view.cx, cy: mapState.view.cy });
      return;
    }
    const drag = st.drag;
    if (!drag) return;
    const dx = e.clientX - drag.lastX, dy = e.clientY - drag.lastY;
    drag.lastX = e.clientX; drag.lastY = e.clientY;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    const s = baseS() * mapState.view.k;
    if (!s) return;
    mapState.view = clampView({ k: mapState.view.k, cx: mapState.view.cx - dx / s, cy: mapState.view.cy - dy / s });
  });
  const endPointer = (e) => {
    const drag = st.drag;
    const wasSingle = st.pointers.size === 1;
    st.pointers.delete(e.pointerId);
    if (st.pointers.size < 2) st.pinch = null;
    if (st.pointers.size === 0) { st.drag = null; canvas.classList.remove("grabbing"); }
    if (wasSingle && drag && drag.moved < 7 && performance.now() - drag.startT < 500) {
      const code = codeAt(e.clientX, e.clientY);
      if (code && opts.onPick) opts.onPick(code);
    }
  };
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("pointerleave", () => { st.hover = null; if (opts.onHover) opts.onHover(null, 0, 0); });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    st.target = null;
    mapState.view = clampView({ k: mapState.view.k * (e.deltaY < 0 ? 1.13 : 1 / 1.13), cx: mapState.view.cx, cy: mapState.view.cy });
  }, { passive: false });

  return {
    flyTo: (code) => {
      const f = st.features.find((x) => x.code === code);
      if (!f) return;
      const c = project(f.centerLng, f.centerLat);
      let kT = mapState.view.k;
      const s0 = baseS();
      if (s0 > 0 && st.w && st.h) {
        const bw = Math.max(10, f.bbox.maxX - f.bbox.minX), bh = Math.max(10, f.bbox.maxY - f.bbox.minY);
        const fit = Math.min(9, Math.max(1, Math.min((0.66 * st.w) / (bw * s0), (0.66 * st.h) / (bh * s0))));
        if (fit > kT) kT = fit;
      }
      st.target = clampView({ k: kT, cx: c[0], cy: c[1] });
    },
    setZoom: (z) => { st.target = clampView({ k: z, cx: mapState.view.cx, cy: mapState.view.cy }); },
    getZoom: () => (st.target ? st.target.k : mapState.view.k),
    reset: () => { st.target = clampView({ k: 1, cx: 500, cy: 250 }); },
    destroy: () => { cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); },
  };
}

function initMap() {
  if (mapState.built) return;
  mapState.built = true;
  if (boundaryCache) {
    mapState.paths = boundaryCache.paths;
    mapState.globeFeatures = boundaryCache.globeFeatures;
    mapState.flatFeatures = boundaryCache.flatFeatures;
    renderMap();
    return;
  }
  renderMap();
  loadBoundary().then((d) => {
    mapState.paths = d.paths;
    mapState.globeFeatures = d.globeFeatures;
    mapState.flatFeatures = d.flatFeatures;
    renderMap();
  }).catch(() => { mapState.failed = true; renderMap(); });
}
</script>

          (iv.idx < total - 1 ?
            '<button type="button" id="ivNext" aria-label="下一题" class="glass-pill flex-1 px-4 py-2.5 text-sm font-bold text-[var(--accent)]">下一题 →</button>'

        '<div class="mx-auto mb-4 max-w-sm text-left">' + stageBarHTML + "</div>" +

        '<div class="font-display mt-1 text-6xl font-black ' + (avg >= 75 ? "text-[var(--good)]" : avg >= 50 ? "text-[var(--warn)]" : "text-[var(--bad)]") + '">' + (avg || "—") + "</div>" +
        '<p class="mx-auto mt-2 max-w-md text-sm leading-relaxed">' + (answeredCount === 0 ? "你还没有提交任何回答。回到题目里至少认真答完 3 题，总评才有意义。" : verdict) + "</p>" +
        '<p class="mt-1 text-xs text-[var(--dim)]">已答 ' + answeredCount + "/" + total + " 题 · " + esc(bank.title) + "</p>" +
        '<div class="mt-4 flex flex-wrap justify-center gap-2">' +
          (!iv.savedSession && answeredCount > 0 ? '<button type="button" id="ivSave" aria-label="保存本场成绩" class="btn-primary rounded-full px-5 py-2.5 font-bold">保存本场成绩</button>' : "") +
          (iv.savedSession ? '<span class="glass-pill px-4 py-2.5 text-sm font-semibold text-[var(--good)]">已保存 ✓</span>' : "") +
          '<button type="button" id="ivAgain" aria-label="重新开始本场练习" class="glass-pill px-5 py-2.5 text-sm font-bold text-[var(--accent)]">再练一轮</button>' +
        "</div></section>") +
  "</div>";

  ivAudioEl = document.getElementById("ivAudio");

      ivAudioEl = document.getElementById("ivAudio");
    });
    const refBtn = document.getElementById("ivRef");
    if (refBtn) refBtn.addEventListener("click", () => {

      refBtn.textContent = iv.refOpen ? "收起参考答法" : "📖 参考答法";
      const body = document.getElementById("ivRefBody");
      if (body) body.classList.toggle("hidden", !iv.refOpen);
    });
    document.getElementById("ivPrev").addEventListener("click", () => { ivStopAudio(); iv.refOpen = false; iv.idx = Math.max(0, iv.idx - 1); renderInterview(); ivPlayQuestion(); });
    const nx = document.getElementById("ivNext");
    if (nx) nx.addEventListener("click", () => { ivStopAudio(); iv.refOpen = false; iv.idx += 1; renderInterview(); ivPlayQuestion(); });
    const fn = document.getElementById("ivFinish");
    if (fn) fn.addEventListener("click", () => { ivStopAudio(); iv.finished = true; renderInterview(); });
  } else {
    const sv = document.getElementById("ivSave");
    if (sv) sv.addEventListener("click", () => {
      sessions.unshift({ bankId: iv.bankId, countryLabel: bank.countryLabel, totalScore: avg, answered: answeredCount });
      iv.savedSession = true;
      persist();
      renderInterview();
    });
    document.getElementById("ivAgain").addEventListener("click", () => ivSwitchBank(iv.bankId));
  }
}

const arrivalState = { sel: "jp", values: {}, recognized: {}, preview: null, ocrMsg: null };
function arrFieldValue(gid, i, f) {
  const k = gid + ":" + i;
  if (Object.prototype.hasOwnProperty.call(arrivalState.values, k)) return arrivalState.values[k];
  if (f.profileKey) {
    if (arrivalState.recognized[f.profileKey]) return arrivalState.recognized[f.profileKey];
    return profileValue(profile, f.profileKey);
  }

}
/* 上传证件图片 → 浏览器本机 OCR（Tesseract.js，经典脚本从 CDN 加载）→ 解析护照机读码/资料页 → 回填字段 */
let arrOcrEnginePromise = null;
function loadOcrEngine() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (arrOcrEnginePromise) return arrOcrEnginePromise;
  arrOcrEnginePromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = () => { if (window.Tesseract) resolve(window.Tesseract); else reject(new Error("engine-missing")); };
    s.onerror = () => reject(new Error("engine-load-failed"));
    document.head.appendChild(s);
  });
  return arrOcrEnginePromise;
}
function arrMrzDate(yymmdd, isExpiry) {
  if (!/^\d{6}$/.test(yymmdd)) return "";
  const yy = parseInt(yymmdd.slice(0, 2), 10);
  const now2 = new Date().getFullYear() % 100;
  const year = isExpiry ? 2000 + yy : (yy > now2 ? 1900 + yy : 2000 + yy);
  return year + "-" + yymmdd.slice(2, 4) + "-" + yymmdd.slice(4, 6);
}
function parsePassportText(raw) {
  const out = {};
  const text = String(raw || "");
  const squashed = text.split(/\r?\n/).map((l) => l.replace(/[«‹»›]/g, "<").replace(/\s+/g, "").toUpperCase());
  const mrz = squashed.filter((l) => l.length >= 28 && /^[A-Z0-9<]+$/.test(l));
  const dataLine = mrz.find((l) => /^[A-Z0-9]{9}\d[A-Z]{3}\d{6}\d[MF<]\d{6}/.test(l));
  const nameLine = mrz.find((l) => /^P[AC-Z<]/.test(l) && l.indexOf("<<") > 4);
  if (dataLine) {
    const docNo = dataLine.slice(0, 9).replace(/</g, "");
    if (docNo.length >= 8) out.passportNo = docNo;
    if (dataLine.slice(10, 13).replace(/</g, "") === "CHN") out.nationality = "CHINA";
    const dob = arrMrzDate(dataLine.slice(13, 19), false); if (dob) out.dateOfBirth = dob;
    const sex = dataLine.charAt(20); if (sex === "M" || sex === "F") out.sex = sex;
    const exp = arrMrzDate(dataLine.slice(21, 27), true); if (exp) out.passportExpiry = exp;
  }
  if (nameLine) {
    const parts = nameLine.slice(5).replace(/<+$/, "").split("<<");
    if (parts[0]) out.surname = parts[0].replace(/</g, " ").trim().replace(/\s+/g, " ");
    if (parts[1]) out.givenNames = parts[1].replace(/</g, " ").trim().replace(/\s+/g, " ");
  }
  if (!out.passportNo) {
    const m = text.toUpperCase().match(/\b[A-Z][0-9]{8}\b/);
    if (m) out.passportNo = m[0];
  }
  if (!out.dateOfBirth) {
    const m = text.match(/(19|20)\d{2}\s*[-/年.]\s*(0?[1-9]|1[0-2])\s*[-/月.]\s*(0?[1-9]|[12]\d|3[01])\s*日?/);
    if (m) { const p = m[0].match(/\d+/g); out.dateOfBirth = p[0] + "-" + String(p[1]).padStart(2, "0") + "-" + String(p[2]).padStart(2, "0"); }
  }
  if (!out.surname) {
    const lines = text.split(/\r?\n/).map((l) => l.trim().toUpperCase()).filter((l) => /^[A-Z]+( [A-Z]+){1,3}$/.test(l) && !/PEOPLE|REPUBLIC|PASSPORT|CHINA|MINISTRY/.test(l));
    if (lines.length) { const w = lines[0].split(" "); out.surname = w[0]; out.givenNames = w.slice(1).join(" "); }
  }
  return out;
}
async function arrRunOcr(file) {
  const setStatus = (msg) => { const n = document.getElementById("arrOcrStatus"); if (n) n.textContent = msg; };
  try {
    setStatus("正在加载识别引擎（首次使用需从 CDN 下载，请稍候）…");
    const T = await loadOcrEngine();
    setStatus("正在识别照片文字… 0%");
    const res = await T.recognize(file, "chi_sim+eng", { logger: (m) => { if (m.status === "recognizing text") setStatus("正在识别照片文字… " + Math.round((m.progress || 0) * 100) + "%"); } });
    const parsed = parsePassportText(res && res.data ? res.data.text : "");
    const keys = Object.keys(parsed);
    if (!keys.length) {
      arrivalState.ocrMsg = { ok: false, text: "没能从这张照片里识别出可用信息。请换一张光线好、无反光的护照照片页再试，或直接在下方逐项手动填写。" };
    } else {
      Object.assign(arrivalState.recognized, parsed);
      const g = ARRIVAL_GUIDES[arrivalState.sel];
      const filled = [];
      g.fields.forEach((f, i) => {
        if (f.profileKey && parsed[f.profileKey]) { arrivalState.values[g.id + ":" + i] = parsed[f.profileKey]; filled.push(f.label); }
      });
      const extra = keys.filter((k) => !g.fields.some((f) => f.profileKey === k)).length;
      arrivalState.ocrMsg = { ok: true, text: "识别完成，已填入：" + (filled.length ? filled.join("、") : "（本国表单没有可对应的证件项）") + (extra ? "；另识别到 " + extra + " 项证件信息，切换到其他国家的入境卡时会自动带入" : "") + "。识别可能有误，请逐项核对，填错了直接改。" };
    }
  } catch (e) {
    arrivalState.ocrMsg = { ok: false, text: "识别没能完成（识别引擎加载或识别失败）。照片不会上传到任何服务器；你可以直接在下方逐项手动填写。" };
  }
  persist();
  renderArrival();
}

      (profState.preview ? '<img src="' + profState.preview + '" alt="你上传的证件照片预览" class="mt-3 max-h-56 w-full rounded-xl object-contain" />' : "") +
      '<p class="mt-2 text-xs leading-relaxed text-[var(--dim)]">分享版说明：照片自动识别是完整版的联网服务，静态版无法调用——请直接在下方逐项手工填写，确认保存后同样能在各国详情页与入境卡里一键复制。</p>' +
    "</section>" +
    '<section class="glass p-4" aria-label="确认并保存档案">' +
      '<h2 class="font-display text-lg font-bold" style="margin:0">逐项确认信息</h2>' +
      '<div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">' +
      PROFILE_FIELDS.map((f) =>
        '<label class="block"><span class="text-xs font-medium text-[var(--dim)]">' + esc(f.label) + " · " + esc(f.en) + "</span>" +
        '<input type="text" aria-label="' + esc(f.label) + '" data-pfield="' + f.key + '" value="' + esc(form[f.key]) + '" placeholder="' + esc(f.placeholder) + '" class="glass-input mt-1 w-full px-3 py-2.5' + (f.mono ? " font-mono" : "") + '" /></label>').join("") +
      "</div>" +
      '<button type="button" id="profSave" aria-label="确认无误，保存我的档案" class="btn-primary mt-4 block w-full rounded-full px-5 py-3.5 text-base font-bold active:scale-[0.98]">' + (profState.savedTick ? "已保存 ✓ 各国填表助手已同步" : "✓ 我已逐项确认无误，保存档案") + "</button>" +
      '<p class="mt-2 text-xs leading-relaxed text-[var(--dim)]">档案保存在这台设备本地（不上传任何服务器），用于各国填表对照与入境卡预填；保存与备份方式见页面下方「数据管理」。递交官网时请再次核对——签证表填错姓名拼写/护照号会导致拒签或作废。</p>' +
    "</section>" +
    ((form.surname || form.passportNo) ?
      '<section class="glass p-4" aria-label="填表助手一键复制">' +
        '<h2 class="font-display text-lg font-bold" style="margin:0">填表助手 · 一键复制</h2>' +
        '<p class="mt-1.5 text-xs leading-relaxed text-[var(--dim)]">按各国官网表单的通用字段顺序排列。用法：先在目标国家详情页点「打开官网」，再回到这里逐项点「复制」、切回官网粘贴——浏览器安全规则不允许软件替你在政府网站里打字，逐项复制是真实可行的方式。</p>' +
        '<div class="mt-3">' + fillAssistantHTML(form) + "</div></section>" : "") +
    '<section class="glass p-4" aria-label="数据管理">' +
      '<h2 class="font-display text-lg font-bold" style="margin:0">💾 数据管理 · 保存在这台设备上</h2>' +
      '<p class="mt-1.5 text-xs leading-relaxed text-[var(--dim)]">你填写的证件档案、各国申请表、入境卡、目标与阶段进度、AI 评估答案和模拟面签成绩，都会在填写时自动保存到这台设备的本地存储里，不经过任何服务器，关掉页面、重启手机也不会丢；将来打包成手机 App 后，数据就保存在 App 在手机上的私有空间里。两点请留意：① 数据按网址来源隔离保存，换一个网址打开就是一份新数据；② 清除浏览器数据或卸载 App 会连数据一起清掉——换手机或清理前，先导出一份备份。</p>' +
      '<div class="mt-3 flex flex-col gap-2 sm:flex-row">' +
        '<button type="button" id="dmExport" class="btn-primary flex-1 rounded-full px-4 py-2.5 text-sm font-bold active:scale-[0.98]">⬇ 导出全部数据</button>' +
        '<button type="button" id="dmCopy" class="glass-pill px-4 py-2.5 text-sm font-bold text-[var(--accent)] active:scale-[0.98]">📋 复制全部数据</button>' +
        '<button type="button" id="dmClear" class="glass-pill px-4 py-2.5 text-sm font-bold text-[var(--bad)] active:scale-[0.98]">🗑 清除全部数据</button>' +
      '</div>' +
      '<p class="mt-2 text-[11px] leading-relaxed text-[var(--dim)]">导出为一个 JSON 文本文件，里面是你的全部填写内容，可留作备份与核对。清除会把本机保存的全部填写内容删掉，不可恢复。</p>' +
    '</section>' +
  "</div>";
  /* 证件类型胶囊只就地切换选中样式（此前整页重建，滚动位置与输入焦点全丢，连点闪屏） */
  panel.querySelectorAll("[data-dochint]").forEach((b) => b.addEventListener("click", () => {
    const v = b.getAttribute("data-dochint");
    if (v === profState.docHint) return;
    profState.docHint = v;
    panel.querySelectorAll("[data-dochint]").forEach((x) => {
      const on = x.getAttribute("data-dochint") === v;
      x.setAttribute("aria-pressed", String(on));
      x.classList.toggle("glass-on", on);
    });
  }));
  const fileInput = document.getElementById("profFile");
  document.getElementById("profUpload").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (!file) return;
    if (profState.preview) URL.revokeObjectURL(profState.preview);
    profState.preview = URL.createObjectURL(file);
    renderProfile();
    showToast("静态版请在下方逐项手工填写");
  });
  panel.querySelectorAll("[data-pfield]").forEach((inp) => inp.addEventListener("input", () => { profState.form[inp.getAttribute("data-pfield")] = inp.value; persist(); }));
  document.getElementById("profSave").addEventListener("click", (e) => {
    profile = Object.assign({}, profState.form, { updatedAt: Date.now() });
    profState.savedTick = true;
    persist();
    renderTabbar();
    renderProfile();
    setTimeout(() => { profState.savedTick = false; const b = document.getElementById("profSave"); if (b) b.textContent = "✓ 我已逐项确认无误，保存档案"; }, 1600);
  });
  const dmE = document.getElementById("dmExport");
  if (dmE) dmE.addEventListener("click", () => { if (downloadTextFile("visa-assistant-backup.json", JSON.stringify(collectAllData(), null, 2))) showToast("已导出全部数据"); else showToast("导出失败，请改用复制"); });
  const dmC = document.getElementById("dmCopy");
  if (dmC) dmC.addEventListener("click", async () => { if (await copyText(JSON.stringify(collectAllData(), null, 2))) showToast("全部数据已复制"); else showToast("复制失败，请用导出"); });
  const dmX = document.getElementById("dmClear");
  if (dmX) dmX.addEventListener("click", () => {
    if (dmX.getAttribute("data-arm") === "1") { clearAllData(); showToast("已清除全部本地数据"); return; }
    dmX.setAttribute("data-arm", "1");
    const old = dmX.textContent;
    dmX.textContent = "再点一次确认清除（不可恢复）";
    setTimeout(() => { if (dmX.isConnected) { dmX.setAttribute("data-arm", "0"); dmX.textContent = old; } }, 3500);
  });
}

function assessResult() {
  const a = assessState;

  else if (a.record === "去过日韩/东南亚") strength += 2;

  if (a.passport === "护照上有发达国家签证/出入境记录") strength += 1;
  const grouped = mapGrouped();
  const pick = (arr, codes) => codes.map((code) => arr.find((c) => c.code === code)).filter(Boolean);
  const freeList = (grouped.get("free") || []).concat(grouped.get("arrival") || []);
  const evisaList = grouped.get("evisa") || [];
  let dests, destNote;
  if (a.record === "有过拒签史") {
    dests = pick(freeList.concat(evisaList), ["th", "my", "sg", "kz", "ae", "vn"]);
    destNote = "有拒签史时，先选免签/电子签目的地稳住出境记录，别急着重复冲上次被拒的国家。";
  } else if (strength >= 5) {
    dests = pick(COUNTRIES, ["jp", "fr", "au", "gb", "kr", "us"]);
    destNote = "你的记录与资产条件较强，可以直接挑战日韩、申根、澳英美等主流目的地。";
